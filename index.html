<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>We Zien Wel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: #000;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* Hero Section with Panorama */
        .hero {
            position: relative;
            height: 45vh;
            min-height: 280px;
            overflow: hidden;
        }

        .panorama-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 600%;
            height: 100%;
            display: flex;
            animation: panSlow 240s linear infinite;
        }

        .panorama-img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.1);
        }

        @keyframes panSlow {
            0% { transform: translateX(0); }
            100% { transform: translateX(-83.333%); }
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom,
                rgba(0,0,0,0.3) 0%,
                rgba(0,0,0,0.1) 40%,
                rgba(0,0,0,0.6) 80%,
                rgba(0,0,0,1) 100%);
        }

        .hero-content {
            position: absolute;
            bottom: 40px;
            left: 40px;
            right: 40px;
        }

        .title {
            font-size: clamp(2rem, 5.5vw, 4rem);
            font-weight: 400;
            letter-spacing: 0.15em;
            margin-bottom: 16px;
            text-transform: lowercase;
            font-style: italic;
            opacity: 0.9;
        }

        .quote {
            font-size: clamp(0.7rem, 2vw, 0.85rem);
            color: rgba(255,255,255,0.5);
            max-width: 500px;
            line-height: 1.6;
            font-style: italic;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quote:hover {
            color: rgba(255,255,255,0.7);
        }

        .quote.exhausted {
            cursor: default;
            color: rgba(255,255,255,0.2);
        }

        /* Main Content */
        .main {
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Stats Row */
        .stats-row {
            display: flex;
            gap: 20px;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            flex-wrap: wrap;
        }

        .stat-group {
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.3s;
            min-width: 100px;
            flex: 1;
        }

        .stat-group:hover {
            opacity: 0.7;
        }

        .stat-group.active {
            opacity: 1;
        }

        .stat-name {
            font-size: clamp(0.55rem, 1.5vw, 0.75rem);
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 8px;
            cursor: text;
            word-break: break-word;
        }

        .stat-name-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            font-family: inherit;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            outline: none;
            width: 100%;
            max-width: 140px;
        }

        .stat-numbers {
            display: flex;
            gap: 12px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.45rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.4);
        }

        /* Calendar */
        .calendar-section {
            margin-bottom: 48px;
        }

        .timeline {
            overflow-x: auto;
            padding-bottom: 20px;
            -webkit-overflow-scrolling: touch;
        }

        .timeline::-webkit-scrollbar {
            height: 6px;
        }

        .timeline::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
        }

        .timeline::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
        }

        .timeline-inner {
            min-width: max-content;
        }

        .month-headers {
            display: flex;
            margin-bottom: 10px;
        }

        .month-headers-spacer {
            width: 90px;
            flex-shrink: 0;
            position: sticky;
            left: 0;
            background: #000;
            z-index: 10;
        }

        .month-header {
            font-size: 0.55rem;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            font-weight: 700;
        }

        .couple-section {
            margin-bottom: 24px;
            position: relative;
        }

        .couple-name {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            position: sticky;
            left: 0;
            background: #000;
            padding-right: 10px;
            z-index: 10;
            width: fit-content;
        }

        .couple-name:hover {
            color: rgba(255,255,255,0.7);
        }

        .couple-section.active .couple-name {
            color: #fff;
        }

        .couple-stats-inline {
            display: none;
        }

        .couple-name-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.5);
            color: #fff;
            font-family: inherit;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            outline: none;
            width: 160px;
        }

        .timeline-row {
            display: flex;
            align-items: center;
            margin-bottom: 3px;
        }

        .row-label {
            width: 90px;
            font-size: 0.45rem;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-right: 10px;
            text-align: right;
            flex-shrink: 0;
            position: sticky;
            left: 0;
            background: #000;
            z-index: 10;
        }

        .days-container {
            display: flex;
            gap: 1px;
            user-select: none;
        }

        .day-cell {
            width: 10px;
            height: 14px;
            background: rgba(255,255,255,0.08);
            cursor: pointer;
            transition: all 0.1s;
            position: relative;
            border-radius: 1px;
        }

        .day-cell:hover {
            background: rgba(255,255,255,0.25);
        }

        .day-cell.weekend {
            background: rgba(255,255,255,0.15);
        }

        .day-cell.holiday {
            background: rgba(255,200,100,0.25);
        }

        .day-cell.weekend.holiday {
            background: rgba(255,200,100,0.3);
        }

        .day-cell.tentative {
            background: rgba(255,255,255,0.4);
        }

        .day-cell.locked {
            background: #fff;
        }

        .day-cell.past {
            opacity: 0.35;
        }

        .day-cell.today {
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.8);
        }

        .day-cell.drag-selecting {
            background: rgba(255,255,255,0.5) !important;
            box-shadow: 0 0 6px rgba(255,255,255,0.5);
        }

        /* DOS-style Label row - single continuous input */
        .label-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            min-height: 20px;
            margin-top: 2px;
        }

        .label-input-container {
            margin-left: 90px;
            background: rgba(0,0,20,0.9);
            border: 1px solid rgba(255,255,255,0.15);
            width: calc(365 * 11px);
            position: relative;
            overflow: hidden;
        }

        .label-full-input {
            width: 100%;
            height: 20px;
            background: transparent;
            border: none;
            font-family: 'VT323', monospace;
            font-size: 13px;
            color: rgba(255,255,255,0.9);
            outline: none;
            letter-spacing: 6.05px;
            padding: 2px 0 2px 2px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            text-transform: uppercase;
        }

        .label-full-input::placeholder {
            color: rgba(255,255,255,0.15);
            letter-spacing: normal;
        }

        .label-full-input:focus {
            color: #fff;
            text-shadow: 0 0 15px rgba(255,255,255,0.8);
        }

        /* Tooltip - follows cursor above */
        .tooltip {
            position: fixed;
            background: #fff;
            color: #000;
            padding: 6px 10px;
            font-size: 0.6rem;
            pointer-events: none;
            z-index: 1000;
            display: none;
            white-space: nowrap;
            transform: translateX(-50%);
        }

        .tooltip-date {
            font-weight: 700;
        }

        .tooltip-label {
            color: rgba(0,0,0,0.6);
            margin-top: 2px;
        }

        .tooltip-holiday {
            color: rgba(180,120,0,1);
            font-size: 0.55rem;
            margin-top: 2px;
        }

        /* Level Up Easter Egg - Mario Style */
        .level-up-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .level-up-overlay.active {
            display: flex;
        }

        .mario-scene {
            position: relative;
            width: 160px;
            height: 160px;
        }

        .question-block {
            width: 32px;
            height: 32px;
            background: #d8a038;
            border: 2px solid #000;
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #000;
            border-radius: 3px;
            box-shadow: inset -3px -3px 0 #806020, inset 3px 3px 0 #f8e078;
        }

        .question-block.hit {
            animation: blockBounce 0.12s ease-out;
            background: #705830;
            box-shadow: inset -3px -3px 0 #483818, inset 3px 3px 0 #907048;
        }

        @keyframes blockBounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-6px); }
        }

        .mario {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 36px;
            opacity: 0;
        }

        .mario.jumping {
            animation: marioJump 2.2s ease-out forwards;
        }

        @keyframes marioJump {
            0% { bottom: 35px; opacity: 1; transform: translateX(-50%) scaleX(1); }
            12% { bottom: 95px; transform: translateX(-50%) scaleX(1); }
            18% { bottom: 85px; transform: translateX(-50%) scaleX(1); }
            28% { bottom: 50px; transform: translateX(-50%) scaleX(1); }
            /* Dance */
            38% { bottom: 50px; transform: translateX(-50%) scaleX(-1); }
            44% { bottom: 58px; transform: translateX(-50%) scaleX(-1); }
            50% { bottom: 50px; transform: translateX(-50%) scaleX(1); }
            56% { bottom: 58px; transform: translateX(-50%) scaleX(1); }
            62% { bottom: 50px; transform: translateX(-50%) scaleX(-1); }
            68% { bottom: 60px; transform: translateX(-50%) scaleX(-1) rotate(-8deg); }
            74% { bottom: 55px; transform: translateX(-50%) scaleX(1) rotate(8deg); }
            80% { bottom: 50px; transform: translateX(-50%) scaleX(1); }
            100% { bottom: 50px; opacity: 1; transform: translateX(-50%) scaleX(1); }
        }

        .star-popup {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            opacity: 0;
        }

        .star-popup.popping {
            animation: starPop 0.7s ease-out forwards;
        }

        @keyframes starPop {
            0% { top: 60px; opacity: 0; transform: translateX(-50%) scale(0); }
            25% { opacity: 1; transform: translateX(-50%) scale(1.2); }
            50% { top: 15px; transform: translateX(-50%) scale(1); }
            100% { top: 5px; opacity: 1; transform: translateX(-50%) scale(1) rotate(360deg); }
        }

        .level-up-text {
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 16px;
            opacity: 0;
            color: #ffd700;
        }

        .level-up-text.show {
            animation: textFadeIn 0.4s ease-out 0.9s forwards;
        }

        @keyframes textFadeIn {
            to { opacity: 1; }
        }

        .level-up-date {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
            margin-top: 10px;
            opacity: 0;
        }

        .level-up-date.show {
            animation: textFadeIn 0.4s ease-out 1.1s forwards;
        }

        /* Mobile styles */
        @media (max-width: 768px) {
            .hero {
                height: 25vh;
                min-height: 140px;
            }

            .hero-content {
                left: 16px;
                right: 16px;
                bottom: 12px;
            }

            .title {
                font-size: 1.6rem;
                margin-bottom: 6px;
            }

            .quote {
                font-size: 0.6rem;
            }

            .main {
                padding: 12px;
            }

            .stats-row {
                display: none;
            }

            .stat-group {
                min-width: 90px;
            }

            .stat-numbers {
                gap: 8px;
            }

            .stat-value {
                font-size: 1.1rem;
            }

            .stat-label {
                font-size: 0.35rem;
            }

            .stat-name {
                font-size: 0.5rem;
            }

            .day-cell {
                width: 6px;
                height: 10px;
            }

            .row-label {
                width: 55px;
                font-size: 0.32rem;
                padding-right: 4px;
            }

            .month-headers {
                display: none;
            }

            .month-headers-spacer {
                width: 55px;
            }

            .mobile-month-nav {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 20px;
                margin-bottom: 16px;
                padding: 8px 0;
            }

            .mobile-month-nav button {
                background: transparent;
                border: 1px solid rgba(255,255,255,0.3);
                color: #fff;
                width: 36px;
                height: 36px;
                font-size: 1.2rem;
                cursor: pointer;
                border-radius: 50%;
            }

            .mobile-month-nav button:active {
                background: rgba(255,255,255,0.2);
            }

            .mobile-month-name {
                font-size: 0.9rem;
                text-transform: uppercase;
                letter-spacing: 2px;
                min-width: 80px;
                text-align: center;
            }

            .label-input-container {
                margin-left: 55px;
                width: calc(365 * 7px);
            }

            .label-full-input {
                letter-spacing: 2.1px;
                font-size: 10px;
                height: 16px;
            }

            .month-header {
                font-size: 0.35rem;
            }

            .couple-name {
                font-size: 0.5rem;
            }

            .couple-stats-inline {
                display: inline;
                font-size: 0.45rem;
                color: rgba(255,255,255,0.5);
                margin-left: 8px;
            }

            .couple-section.active .couple-stats-inline {
                color: rgba(255,255,255,0.7);
            }

            .timeline {
                overflow-x: hidden;
            }

            .timeline-inner {
                transition: transform 0.3s ease;
            }

            .label-row {
                display: none;
            }
        }

        .mobile-month-nav {
            display: none;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="panorama-container">
            <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1600&auto=format&fit=crop" class="panorama-img" alt="">
            <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1600&auto=format&fit=crop" class="panorama-img" alt="">
            <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=1600&auto=format&fit=crop" class="panorama-img" alt="">
            <img src="https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=1600&auto=format&fit=crop" class="panorama-img" alt="">
            <img src="https://images.unsplash.com/photo-1518173946687-a4c036bc3c95?w=1600&auto=format&fit=crop" class="panorama-img" alt="">
            <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1600&auto=format&fit=crop" class="panorama-img" alt="">
        </div>
        <div class="hero-overlay"></div>

            <p class="quote" id="dailyQuote" onclick="cycleQuote()"></p>

    </div>

    <div class="main" id="mainContent">
        <div class="stats-row" id="statsRow"></div>

        <div class="calendar-section">
            <div class="mobile-month-nav" id="mobileMonthNav">
                <button onclick="prevMonth()">←</button>
                <span class="mobile-month-name" id="mobileMonthName">Jan</span>

        </div>
        <div class="level-up-text" id="levelUpText">Iedereen mee!</div>
        <div class="level-up-date" id="levelUpDate"></div>
    </div>

    <div class="tooltip" id="tooltip">
        <div class="tooltip-date" id="tooltipDate"></div>
        <div class="tooltip-label" id="tooltipLabel"></div>
        <div class="tooltip-holiday" id="tooltipHoliday"></div>
    </div>

    <script>
        let audioCtx = null;

        function playLevelUpSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const notes = [
                { freq: 330, dur: 0.08 }, { freq: 392, dur: 0.08 }, { freq: 523, dur: 0.08 },
                { freq: 659, dur: 0.08 }, { freq: 784, dur: 0.08 }, { freq: 1047, dur: 0.2 }
            ];
            let t = audioCtx.currentTime;
            notes.forEach(({ freq, dur }) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.value = freq; osc.type = 'square';
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + dur);
                osc.start(t); osc.stop(t + dur);
                t += dur * 0.7;
            });
        }

        function playBlockSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.08);
            osc.type = 'square';
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        }
    </script>

    <script>
        // Progressive quotes - getting darker with each click
        const QUOTE_STAGES = [
            ["The road less traveled is less traveled for a reason."],
            ["Adventure awaits. So does laundry."],
            ["Not all who wander are lost. Some are just avoiding home."],
            ["Collect moments, not things. Moments fade too."],
            ["Escape the ordinary. The ordinary always finds you."],
            ["The horizon keeps moving. So do you. Why?"]
        ];

        let quoteStage = 0;
        let quoteIndex = 0;

        function cycleQuote() {
            const el = document.getElementById('dailyQuote');
            if (quoteStage >= QUOTE_STAGES.length - 1) {
                el.classList.add('exhausted');
                return;
            }
            quoteStage++;
            el.style.opacity = '0';
            setTimeout(() => {
                el.textContent = QUOTE_STAGES[quoteStage][0];
                el.style.opacity = '';
            }, 150);
        }

        function setInitialQuote() {
            document.getElementById('dailyQuote').textContent = QUOTE_STAGES[0][0];
        }

        const BELGIAN_HOLIDAYS = {
            '0-1': 'Nieuwjaar', '3-5': 'Paaszondag', '3-6': 'Paasmaandag',
            '4-1': 'Dag van de Arbeid', '4-14': 'O.L.H. Hemelvaart',
            '4-24': 'Pinksterzondag', '4-25': 'Pinkstermaandag',
            '6-21': 'Nationale Feestdag', '7-15': 'O.L.V. Hemelvaart',
            '10-1': 'Allerheiligen', '10-11': 'Wapenstilstand', '11-25': 'Kerstmis'
        };

        const DEFAULT_COUPLES = ['Tobe & Nina', 'Arne & Margaux', 'Nick'];
        let couples = [...DEFAULT_COUPLES];
        let currentCouple = 0;
        let bookings = {};
        let labels = {};
        let shownLevelUps = new Set();
        let isDragging = false, dragStartDate = null, dragEndDate = null, dragType = null, dragCouple = null;
        let currentMobileMonth = 0;
        const MONTHS = ['Jan', 'Feb', 'Mrt', 'Apr', 'Mei', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dec'];
        const DAYS_IN_MONTH = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

        function isMobile() {
            return window.innerWidth <= 768;
        }

        function prevMonth() {
            if (currentMobileMonth > 0) {
                currentMobileMonth--;
                updateMobileMonth();
            }
        }

        function nextMonth() {
            if (currentMobileMonth < 11) {
                currentMobileMonth++;
                updateMobileMonth();
            }
        }

        function updateMobileMonth() {
            document.getElementById('mobileMonthName').textContent = MONTHS[currentMobileMonth];
            // Calculate scroll position
            let offset = 0;
            for (let i = 0; i < currentMobileMonth; i++) {
                offset += DAYS_IN_MONTH[i] * 7; // 7px per day on mobile (6px + 1px gap)
            }
            document.getElementById('timeline').style.transform = `translateX(-${offset}px)`;
        }

        function dateStrToIndex(d) {
            const [m, dy] = d.split('-').map(Number);
            let i = 0; for (let x = 0; x < m; x++) i += DAYS_IN_MONTH[x];
            return i + dy - 1;
        }
        function indexToDateStr(i) {
            let r = i;
            for (let m = 0; m < 12; m++) {
                if (r < DAYS_IN_MONTH[m]) return `${m}-${r + 1}`;
                r -= DAYS_IN_MONTH[m];
            }
            return '11-31';
        }
        function getDateRange(a, b) {
            const ai = dateStrToIndex(a), bi = dateStrToIndex(b);
            const min = Math.min(ai, bi), max = Math.max(ai, bi);
            const r = []; for (let i = min; i <= max; i++) r.push(indexToDateStr(i));
            return r;
        }
        function isWeekend(m, d) { const dt = new Date(2026, m, d); return dt.getDay() === 0 || dt.getDay() === 6; }

        function init() {
            setInitialQuote();
            loadData();
            render();
            setupEventListeners();
        }

        function loadData() {
            const s = localStorage.getItem('californiaDreaming2026_v5');
            if (s) {
                const d = JSON.parse(s);
                couples = d.couples || [...DEFAULT_COUPLES];
                bookings = d.bookings || {};
                labels = d.labels || {};
                shownLevelUps = new Set(d.shownLevelUps || []);
            }
            couples.forEach((_, i) => {
                if (!bookings[i]) bookings[i] = { tentative: [], locked: [] };
                if (!labels[i]) labels[i] = {};
            });
        }

        function saveData() {
            localStorage.setItem('californiaDreaming2026_v5', JSON.stringify({
                couples, bookings, labels, shownLevelUps: [...shownLevelUps]
            }));
        }

        function setupEventListeners() {
            document.addEventListener('keydown', e => {
                if (e.key >= '1' && e.key <= '3' && document.activeElement.tagName !== 'INPUT')
                    selectCouple(parseInt(e.key) - 1);
            });
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
        }

        function endDrag() {
            if (isDragging && dragStartDate && dragEndDate) finishDragSelection();
            isDragging = false; dragStartDate = null; dragEndDate = null;
            clearDragHighlights();
        }

        function selectCouple(i) { currentCouple = i; render(); }
        function render() { renderStats(); renderTimeline(); }

        function editCoupleName(i, el) {
            const cur = couples[i];
            const inp = document.createElement('input');
            inp.type = 'text'; inp.className = 'couple-name-input'; inp.value = cur;
            el.replaceWith(inp); inp.focus(); inp.select();
            const save = () => { couples[i] = inp.value.trim() || DEFAULT_COUPLES[i]; saveData(); render(); };
            inp.onblur = save;
            inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); if (e.key === 'Escape') { inp.value = cur; inp.blur(); } };
        }

        function renderStats() {
            const c = document.getElementById('statsRow');
            const today = new Date();
            c.innerHTML = couples.map((n, i) => {
                const tent = (bookings[i]?.tentative || []).length;
                const lock = bookings[i]?.locked || [];
                let past = 0, future = 0;
                lock.forEach(ds => {
                    const [m, d] = ds.split('-').map(Number);
                    if (new Date(2026, m, d) < today) past++; else future++;
                });
                return `<div class="stat-group ${i === currentCouple ? 'active' : ''}" onclick="selectCouple(${i})">
                    <div class="stat-name" onclick="event.stopPropagation(); editCoupleName(${i}, this)">${n}</div>
                    <div class="stat-numbers">
                        <div class="stat-item"><div class="stat-value">${past}</div><div class="stat-label">Geweest</div></div>
                        <div class="stat-item"><div class="stat-value">${future}</div><div class="stat-label">Gepland</div></div>
                        <div class="stat-item"><div class="stat-value">${tent}</div><div class="stat-label">Misschien</div></div>
                    </div></div>`;
            }).join('');
        }

        function isBooked(ci, t, ds) { return (bookings[ci]?.[t] || []).includes(ds); }

        function checkLevelUp(ds) {
            if (couples.every((_, i) => isBooked(i, 'locked', ds)) && !shownLevelUps.has(ds)) {
                shownLevelUps.add(ds); saveData(); showLevelUp(ds);
            }
        }

        function showLevelUp(ds) {
            const [m, d] = ds.split('-').map(Number);
            document.getElementById('levelUpDate').textContent = `${d} ${MONTHS[m]} 2026`;
            const ov = document.getElementById('levelUpOverlay');
            const bl = document.getElementById('questionBlock');
            const st = document.getElementById('starPopup');
            const ma = document.getElementById('mario');
            const tx = document.getElementById('levelUpText');
            const dt = document.getElementById('levelUpDate');
            bl.classList.remove('hit'); st.classList.remove('popping');
            ma.classList.remove('jumping'); tx.classList.remove('show'); dt.classList.remove('show');
            ov.classList.add('active');
            setTimeout(() => ma.classList.add('jumping'), 80);
            setTimeout(() => { bl.classList.add('hit'); playBlockSound(); }, 200);
            setTimeout(() => { st.classList.add('popping'); playLevelUpSound(); }, 350);
            setTimeout(() => { tx.classList.add('show'); dt.classList.add('show'); }, 700);
        }

        function closeLevelUp() { document.getElementById('levelUpOverlay').classList.remove('active'); }

        function renderTimeline() {
            const c = document.getElementById('timeline');
            const today = new Date();
            let h = '<div class="month-headers"><div class="month-headers-spacer"></div>';
            MONTHS.forEach((m, i) => { h += `<div class="month-header" style="width:${DAYS_IN_MONTH[i] * 11}px">${m}</div>`; });
            h += '</div>';

            couples.forEach((n, ci) => {
                const act = ci === currentCouple;
                // Calculate stats for inline display
                const tent = (bookings[ci]?.tentative || []).length;
                const lock = bookings[ci]?.locked || [];
                let past = 0, future = 0;
                lock.forEach(ds => {
                    const [m, d] = ds.split('-').map(Number);
                    if (new Date(2026, m, d) < today) past++; else future++;
                });

                h += `<div class="couple-section ${act ? 'active' : ''}">`;
                h += `<div class="couple-name" onclick="editCoupleName(${ci}, this)">${n}<span class="couple-stats-inline"> · ${past} geweest · ${future} gepland · ${tent} misschien</span></div>`;

                ['tentative', 'locked'].forEach(type => {
                    const lbl = type === 'tentative' ? 'We zien wel' : 'Gaan we doen';
                    h += `<div class="timeline-row"><div class="row-label">${lbl}</div><div class="days-container">`;
                    MONTHS.forEach((_, mi) => {
                        for (let d = 1; d <= DAYS_IN_MONTH[mi]; d++) {
                            const ds = `${mi}-${d}`;
                            const dt = new Date(2026, mi, d);
                            const isPast = dt < today, tod = dt.toDateString() === today.toDateString();
                            const booked = isBooked(ci, type, ds);
                            const we = isWeekend(mi, d), hol = BELGIAN_HOLIDAYS[ds];
                            let cls = 'day-cell';
                            if (we) cls += ' weekend'; if (hol) cls += ' holiday';
                            if (booked) cls += type === 'tentative' ? ' tentative' : ' locked';
                            if (isPast) cls += ' past'; if (tod) cls += ' today';
                            h += `<div class="${cls}" data-couple="${ci}" data-type="${type}" data-date="${ds}"
                                data-display="${d} ${MONTHS[mi]} 2026" data-holiday="${hol || ''}"
                                onmousedown="startDrag(${ci},'${type}','${ds}',event)"
                                ontouchstart="startDrag(${ci},'${type}','${ds}',event)"
                                onmouseenter="continueDrag('${ds}',event)"
                                ontouchmove="handleTouchMove(event)"
                                onmouseenter="showTooltip(event)" onmouseleave="hideTooltip()"></div>`;
                        }
                    });
                    h += '</div></div>';
                });

                // Single continuous label input
                const labelStr = getLabelString(ci);
                h += `<div class="label-row"><div class="row-label"></div><div class="label-input-container">`;
                h += `<input type="text" class="label-full-input" value="${labelStr}"
                    data-couple="${ci}"
                    onkeydown="handleLabelKeydown(event, ${ci}, this)"
                    oninput="handleLabelInput(${ci}, this)"
                    placeholder="wat gaan we doen?">`;
                h += '</div></div></div>';
            });
            c.innerHTML = h;
        }

        const TOTAL_DAYS = 365;

        function getLabelString(ci) {
            // Convert labels object to a string with characters at correct positions
            // Always returns a string of exactly TOTAL_DAYS characters
            let str = ' '.repeat(TOTAL_DAYS);
            const sortedDates = Object.keys(labels[ci] || {}).sort((a, b) => dateStrToIndex(a) - dateStrToIndex(b));
            sortedDates.forEach(ds => {
                const pos = dateStrToIndex(ds);
                const label = labels[ci][ds];
                // Place label at position, overwriting spaces
                str = str.slice(0, pos) + label + str.slice(pos + label.length);
            });
            return str;
        }

        function handleLabelKeydown(e, ci, input) {
            const pos = input.selectionStart;
            const val = input.value.padEnd(TOTAL_DAYS, ' ').slice(0, TOTAL_DAYS);

            // When typing a character (not special keys)
            if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                // Replace character at cursor position (overwrite mode)
                const newVal = val.slice(0, pos) + e.key + val.slice(pos + 1);
                input.value = newVal;
                input.setSelectionRange(pos + 1, pos + 1);
                parseAndSaveLabels(ci, newVal);
            }
            // Backspace should replace with space, not delete
            if (e.key === 'Backspace' && pos > 0) {
                e.preventDefault();
                const newVal = val.slice(0, pos - 1) + ' ' + val.slice(pos);
                input.value = newVal;
                input.setSelectionRange(pos - 1, pos - 1);
                parseAndSaveLabels(ci, newVal);
            }
            // Delete should replace with space
            if (e.key === 'Delete' && pos < val.length) {
                e.preventDefault();
                const newVal = val.slice(0, pos) + ' ' + val.slice(pos + 1);
                input.value = newVal;
                input.setSelectionRange(pos, pos);
                parseAndSaveLabels(ci, newVal);
            }
        }

        function handleLabelInput(ci, input) {
            // Ensure string is always TOTAL_DAYS long
            input.value = input.value.padEnd(TOTAL_DAYS, ' ').slice(0, TOTAL_DAYS);
            parseAndSaveLabels(ci, input.value);
        }

        function parseAndSaveLabels(ci, str) {
            // Clear existing labels for this couple
            labels[ci] = {};
            // Parse the string character by character
            let i = 0;
            while (i < str.length) {
                if (str[i] !== ' ') {
                    // Found start of a label
                    let labelStart = i;
                    let label = '';
                    while (i < str.length && str[i] !== ' ') {
                        label += str[i];
                        i++;
                    }
                    // Store the label at the starting position
                    const ds = indexToDateStr(labelStart);
                    labels[ci][ds] = label;
                } else {
                    i++;
                }
            }
            saveData();
        }

        function startDrag(ci, t, ds, e) {
            e.preventDefault();
            if (ci !== currentCouple) { selectCouple(ci); return; }

            // On mobile, just toggle single day immediately
            if (isMobile()) {
                toggleSingleDay(ci, t, ds);
                return;
            }

            isDragging = true; dragStartDate = ds; dragEndDate = ds; dragType = t; dragCouple = ci;
            highlightDragSelection();
        }

        function toggleSingleDay(ci, t, ds) {
            const list = bookings[ci][t];
            const idx = list.indexOf(ds);
            if (idx > -1) {
                list.splice(idx, 1);
            } else {
                list.push(ds);
                // If locking, remove from tentative
                if (t === 'locked') {
                    const tentList = bookings[ci].tentative;
                    const ti = tentList.indexOf(ds);
                    if (ti > -1) tentList.splice(ti, 1);
                }
            }
            saveData(); render();
            if (t === 'locked' && idx === -1) setTimeout(() => checkLevelUp(ds), 80);
        }

        function continueDrag(ds, e) {
            if (isMobile()) return;
            if (!isDragging) { showTooltip(e); return; }
            dragEndDate = ds; highlightDragSelection();
        }

        function handleTouchMove(e) {
            // Disable touch drag on mobile
            if (isMobile()) return;
            if (!isDragging) return;
            const t = e.touches[0];
            const el = document.elementFromPoint(t.clientX, t.clientY);
            if (el?.dataset?.date) { dragEndDate = el.dataset.date; highlightDragSelection(); }
        }

        function highlightDragSelection() {
            clearDragHighlights();
            if (!dragStartDate || !dragEndDate) return;
            getDateRange(dragStartDate, dragEndDate).forEach(ds => {
                document.querySelectorAll(`[data-date="${ds}"][data-type="${dragType}"][data-couple="${dragCouple}"]`)
                    .forEach(c => c.classList.add('drag-selecting'));
            });
        }

        function clearDragHighlights() {
            document.querySelectorAll('.drag-selecting').forEach(e => e.classList.remove('drag-selecting'));
        }

        function finishDragSelection() {
            if (!dragStartDate || !dragEndDate || dragCouple === null) return;
            const dates = getDateRange(dragStartDate, dragEndDate);
            const list = bookings[dragCouple][dragType];
            const first = list.includes(dragStartDate);
            dates.forEach(ds => {
                const idx = list.indexOf(ds);
                if (first) { if (idx > -1) list.splice(idx, 1); }
                else { if (idx === -1) list.push(ds); }
            });
            // If locking dates, auto-remove from tentative
            if (dragType === 'locked' && !first) {
                const tentList = bookings[dragCouple].tentative;
                dates.forEach(ds => {
                    const ti = tentList.indexOf(ds);
                    if (ti > -1) tentList.splice(ti, 1);
                });
            }
            saveData(); render();
            if (dragType === 'locked' && !first) dates.forEach(ds => setTimeout(() => checkLevelUp(ds), 80));
        }

        function showTooltip(e) {
            const el = e.target; if (!el?.dataset?.display) return;
            document.getElementById('tooltipDate').textContent = el.dataset.display;
            let lbl = '';
            if (el.classList.contains('tentative')) lbl = 'We zien wel';
            else if (el.classList.contains('locked')) lbl = 'Gaan we doen';
            document.getElementById('tooltipLabel').textContent = lbl;
            document.getElementById('tooltipHoliday').textContent = el.dataset.holiday || '';
            const tt = document.getElementById('tooltip');
            tt.style.display = 'block';
            tt.style.left = e.pageX + 'px';
            tt.style.top = (e.pageY - 45) + 'px';
        }

        function hideTooltip() { document.getElementById('tooltip').style.display = 'none'; }

        init();
    </script>
</body>
</html>
