<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>We Zien Wel</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Mono', monospace;
            background: #f4f4f2;
            color: #1a1a1a;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* ─── HEADER ─── */
        .app-header {
            position: relative;
            padding: 52px 20px 20px;
            background: #fff;
            overflow: hidden;
            border-bottom: 1px solid rgba(0,0,0,0.07);
        }

        .header-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.09;
            filter: grayscale(1) contrast(1.1);
            pointer-events: none;
            transition: background-image 0.8s;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            position: relative;
        }

        .app-title {
            font-size: 1.9rem;
            font-style: italic;
            font-weight: 400;
            text-transform: lowercase;
            letter-spacing: 0.07em;
            line-height: 1;
        }

        .icon-btn {
            background: none;
            border: 1px solid rgba(0,0,0,0.15);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:active { background: rgba(0,0,0,0.06); }

        .month-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            position: relative;
        }

        .month-nav-btn {
            background: none;
            border: 1px solid rgba(0,0,0,0.18);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #1a1a1a;
        }
        .month-nav-btn:active { background: rgba(0,0,0,0.07); }

        .month-nav-label {
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            flex: 1;
        }

        /* ─── COUPLE LEGEND ─── */
        .couple-legend {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .couple-legend-row {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .couple-color-swatch {
            width: 22px;
            height: 7px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .couple-legend-name {
            font-size: 0.58rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            flex: 1;
        }

        .couple-legend-stats {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        /* ─── CALENDAR ─── */
        .cal-wrapper {
            background: #fff;
        }

        .cal-dow-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-bottom: 1px solid rgba(0,0,0,0.07);
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 20;
            box-shadow: 0 1px 0 rgba(0,0,0,0.04);
        }

        .cal-dow {
            text-align: center;
            font-size: 0.48rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 9px 0;
            color: rgba(0,0,0,0.38);
        }
        .cal-dow.weekend { color: rgba(0,0,0,0.22); }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-left: 1px solid rgba(0,0,0,0.05);
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .cal-day {
            border-right: 1px solid rgba(0,0,0,0.05);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            min-height: 72px;
            padding: 6px 4px 5px 5px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .cal-day:active { background: rgba(0,0,0,0.04) !important; }
        .cal-day.empty { cursor: default; background: rgba(0,0,0,0.015); }
        .cal-day.empty:active { background: rgba(0,0,0,0.015) !important; }
        .cal-day.past { opacity: 0.5; }
        .cal-day.school-hol { background: rgba(255,195,0,0.055); }
        .cal-day.pub-hol { background: rgba(220,53,69,0.045); }
        .cal-day.weekend .day-num { color: rgba(0,0,0,0.38); }

        .day-num {
            font-size: 0.7rem;
            font-weight: 700;
            color: #1a1a1a;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            line-height: 1;
            border-radius: 50%;
        }
        .cal-day.today .day-num {
            background: #1a1a1a;
            color: #fff;
        }

        .day-hol-label {
            font-size: 0.33rem;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            color: rgba(180,30,30,0.75);
            line-height: 1.25;
            margin-top: 2px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .day-school-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(190,140,0,0.6);
            margin-top: 3px;
        }

        .day-bars {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding-top: 3px;
        }

        .booking-bar {
            height: 5px;
            border-radius: 2px;
            width: 100%;
        }

        /* ─── DAY BOTTOM SHEET ─── */
        .day-sheet {
            position: fixed;
            inset: 0;
            z-index: 400;
            display: none;
        }
        .day-sheet.active { display: block; }

        .day-sheet-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.32);
        }

        .day-sheet-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-radius: 18px 18px 0 0;
            padding: 12px 20px 44px;
            max-height: 72vh;
            overflow-y: auto;
        }

        .sheet-handle {
            width: 36px;
            height: 4px;
            background: rgba(0,0,0,0.12);
            border-radius: 2px;
            margin: 0 auto 16px;
        }

        .sheet-date-title {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .sheet-hol-label {
            font-size: 0.58rem;
            color: rgba(180,30,30,0.8);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .sheet-school-label {
            font-size: 0.58rem;
            color: rgba(160,120,0,0.85);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .sheet-empty-msg {
            font-size: 0.62rem;
            color: rgba(0,0,0,0.35);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 12px 0;
        }

        .sheet-booking-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }

        .sheet-booking-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .sheet-booking-info { flex: 1; }

        .sheet-booking-name {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sheet-booking-type {
            font-size: 0.5rem;
            color: rgba(0,0,0,0.42);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sheet-del-btn {
            background: none;
            border: 1px solid rgba(0,0,0,0.12);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            color: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sheet-del-btn:active { background: rgba(220,50,50,0.08); border-color: rgba(220,50,50,0.35); }

        .sheet-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .sheet-btn {
            flex: 1;
            padding: 13px;
            font-family: inherit;
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 10px;
        }
        .sheet-btn-add {
            background: #1a1a1a;
            color: #fff;
            border: none;
            flex: 2;
        }
        .sheet-btn-add:active { background: #333; }
        .sheet-btn-close {
            background: transparent;
            border: 1px solid rgba(0,0,0,0.18);
            color: #1a1a1a;
        }
        .sheet-btn-close:active { background: rgba(0,0,0,0.05); }

        /* ─── FUEL SECTION ─── */
        .fuel-section {
            padding: 28px 20px 88px;
            border-top: 3px solid rgba(0,0,0,0.06);
            background: #fff;
            margin-top: 8px;
        }

        .fuel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .fuel-title {
            font-size: 0.88rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .fuel-actions { display: flex; gap: 8px; }

        .fuel-btn {
            padding: 8px 14px;
            font-family: inherit;
            font-size: 0.52rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(0,0,0,0.18);
            background: transparent;
            cursor: pointer;
            border-radius: 20px;
            white-space: nowrap;
        }
        .fuel-btn:active { background: rgba(0,0,0,0.05); }

        .fuel-balances {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .fuel-balance-card {
            background: rgba(0,0,0,0.03);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
        }

        .fuel-balance-name {
            font-size: 0.45rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(0,0,0,0.42);
            margin-bottom: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .fuel-balance-amount {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .fuel-balance-amount.positive { color: #34A853; }
        .fuel-balance-amount.negative { color: #EA4335; }

        .fuel-balance-details {
            font-size: 0.37rem;
            color: rgba(0,0,0,0.36);
            text-transform: uppercase;
            letter-spacing: 0.2px;
            line-height: 1.6;
        }

        .fuel-history-title {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(0,0,0,0.36);
            margin-bottom: 10px;
        }

        .fuel-history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            gap: 10px;
        }

        .fuel-history-info { flex: 1; }
        .fuel-history-type { font-size: 0.62rem; margin-bottom: 2px; }
        .fuel-history-meta {
            font-size: 0.46rem;
            color: rgba(0,0,0,0.36);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .fuel-history-delete {
            background: none;
            border: 1px solid rgba(0,0,0,0.1);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.8rem;
            color: rgba(0,0,0,0.36);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fuel-history-toggle {
            margin-top: 12px;
            background: none;
            border: 1px solid rgba(0,0,0,0.13);
            padding: 9px 16px;
            font-family: inherit;
            font-size: 0.52rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 20px;
            width: 100%;
        }

        /* ─── FAB ─── */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 20px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #1a1a1a;
            color: #fff;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 18px rgba(0,0,0,0.28);
            transition: transform 0.15s;
        }
        .fab:active { transform: scale(0.92); }

        /* ─── MODAL BOTTOM SHEETS ─── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 500;
            display: none;
            align-items: flex-end;
        }
        .modal-overlay.active { display: flex; }

        .modal-sheet {
            background: #fff;
            border-radius: 20px 20px 0 0;
            padding: 16px 20px 50px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-handle {
            width: 36px;
            height: 4px;
            background: rgba(0,0,0,0.11);
            border-radius: 2px;
            margin: 0 auto 18px;
        }

        .modal-title {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 14px; }

        .form-group label {
            display: block;
            font-size: 0.52rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(0,0,0,0.42);
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(0,0,0,0.14);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.8rem;
            background: #fafafa;
            color: #1a1a1a;
            outline: none;
            -webkit-appearance: none;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: rgba(0,0,0,0.38);
            background: #fff;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-modal-cancel {
            flex: 1;
            padding: 13px;
            font-family: inherit;
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            background: transparent;
            border: 1px solid rgba(0,0,0,0.18);
            border-radius: 10px;
        }

        .btn-modal-primary {
            flex: 2;
            padding: 13px;
            font-family: inherit;
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 10px;
        }
        .btn-modal-primary:disabled { background: rgba(0,0,0,0.18); cursor: not-allowed; }

        /* ─── UPLOAD MODAL ─── */
        .upload-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .upload-modal.active { display: flex; }

        .upload-modal-content {
            background: #fff;
            border-radius: 16px;
            padding: 28px 24px;
            width: 100%;
            max-width: 440px;
        }

        .upload-modal h3 {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-align: center;
        }

        .upload-dropzone {
            border: 2px dashed rgba(0,0,0,0.18);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 16px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .upload-dropzone:hover, .upload-dropzone.dragover {
            border-color: #1a1a1a;
            background: rgba(0,0,0,0.02);
        }
        .upload-dropzone p {
            font-size: 0.65rem;
            color: rgba(0,0,0,0.42);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .upload-preview {
            max-width: 100%;
            max-height: 180px;
            border-radius: 8px;
            filter: grayscale(1);
            display: none;
            margin-bottom: 14px;
        }
        .upload-preview.show { display: block; }

        .location-input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(0,0,0,0.14);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            text-align: center;
            outline: none;
        }
        .location-input:focus { border-color: rgba(0,0,0,0.38); }

        .upload-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .upload-actions button {
            padding: 12px 24px;
            font-family: inherit;
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 10px;
        }
        .btn-cancel { background: transparent; border: 1px solid rgba(0,0,0,0.18); }
        .btn-save { background: #1a1a1a; color: #fff; border: none; }
        .btn-save:disabled { background: rgba(0,0,0,0.2); cursor: not-allowed; }

        /* ─── LEVEL-UP OVERLAY ─── */
        .level-up-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.96);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .level-up-overlay.active { display: flex; }

        .van-scene { position: relative; width: 200px; height: 200px; }

        .donut-track {
            position: absolute;
            top: 50%; left: 50%;
            width: 120px; height: 120px;
            transform: translate(-50%, -50%);
            border: 3px dashed rgba(0,0,0,0.18);
            border-radius: 50%;
        }

        .van {
            position: absolute;
            top: 50%; left: 50%;
            font-size: 32px;
            transform-origin: center center;
            opacity: 0;
        }
        .van.spinning { animation: vanDonut 2.5s ease-in-out forwards; }

        @keyframes vanDonut {
            0%   { opacity:1; transform: translate(-50%,-50%) rotate(0deg) translateX(60px) rotate(0deg); }
            100% { opacity:1; transform: translate(-50%,-50%) rotate(1080deg) translateX(60px) rotate(-1080deg); }
        }

        .tire-marks {
            position: absolute;
            top: 50%; left: 50%;
            width: 110px; height: 110px;
            transform: translate(-50%,-50%);
            border: 4px solid transparent;
            border-radius: 50%;
            opacity: 0;
        }
        .tire-marks.show { animation: tireMarks 2s ease-out forwards; }
        @keyframes tireMarks {
            0%   { opacity:0; border-color:transparent; }
            20%  { opacity:0.6; border-color:rgba(0,0,0,0.28); }
            100% { opacity:0.3; border-color:rgba(0,0,0,0.13); }
        }

        .dust-cloud {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            font-size: 40px;
            opacity: 0;
        }
        .dust-cloud.puff { animation: dustPuff 0.8s ease-out forwards; }
        @keyframes dustPuff {
            0%   { opacity:0; transform:translate(-50%,-50%) scale(0.5); }
            30%  { opacity:0.7; transform:translate(-50%,-50%) scale(1.2); }
            100% { opacity:0; transform:translate(-50%,-50%) scale(2); }
        }

        .level-up-text {
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 16px;
            opacity: 0;
        }
        .level-up-text.show { animation: fadeIn 0.4s ease-out 0.9s forwards; }

        .level-up-date {
            font-size: 0.75rem;
            color: rgba(0,0,0,0.55);
            margin-top: 10px;
            opacity: 0;
        }
        .level-up-date.show { animation: fadeIn 0.4s ease-out 1.1s forwards; }
        @keyframes fadeIn { to { opacity:1; } }
    </style>
</head>
<body>

<!-- ─── APP HEADER ─── -->
<header class="app-header">
    <div class="header-bg" id="headerBg"></div>

<script>
    let audioCtx = null;
    function playHonkSound() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.type = 'sawtooth';
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        setTimeout(() => {
            const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
            o2.connect(g2); g2.connect(audioCtx.destination);
            o2.frequency.setValueAtTime(450, audioCtx.currentTime); o2.type = 'sawtooth';
            g2.gain.setValueAtTime(0.15, audioCtx.currentTime);
            g2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            o2.start(); o2.stop(audioCtx.currentTime + 0.4);
        }, 350);
    }
    function playTireSound() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const sz = audioCtx.sampleRate * 0.8, buf = audioCtx.createBuffer(1, sz, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < sz; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sz * 0.3));
        const noise = audioCtx.createBufferSource(); noise.buffer = buf;
        const filt = audioCtx.createBiquadFilter(); filt.type = 'highpass'; filt.frequency.value = 2000;
        const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        noise.connect(filt); filt.connect(gain); gain.connect(audioCtx.destination); noise.start();
    }
</script>

<script>
    let photos = [], pendingPhotoData = null, isSavingPhotos = false;

    async function loadPhotos() {
        try {
            const snap = await db.collection('wezienwel_photos').orderBy('timestamp', 'desc').get();
            photos = [];
            snap.forEach(doc => { const d = doc.data(); photos.push({ id: doc.id, src: d.src, location: d.location }); });
        } catch (e) {
            const saved = localStorage.getItem('wezienwel_photos_v1');
            if (saved) photos = JSON.parse(saved);
        }
    }

    function updateHeaderPhoto() {
        const bg = document.getElementById('headerBg');
        bg.style.backgroundImage = photos.length > 0 ? `url('${photos[0].src}')` : '';
    }

    async function saveNewPhoto(src, location) {
        isSavingPhotos = true;
        try {
            const ref = await db.collection('wezienwel_photos').add({ src, location, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
            return ref.id;
        } catch (e) { alert('Error: ' + e.message); return null; }
        finally { setTimeout(() => { isSavingPhotos = false; }, 1000); }
    }

    async function deletePhotoFromDb(id) {
        if (!id) return;
        try { await db.collection('wezienwel_photos').doc(id).delete(); } catch (e) {}
    }

    function openUploadModal() {
        pendingPhotoData = null;
        document.getElementById('uploadPreview').classList.remove('show');
        document.getElementById('locationInput').value = '';
        document.getElementById('btnSave').disabled = true;
        document.getElementById('uploadModal').classList.add('active');
    }
    function closeUploadModal() { document.getElementById('uploadModal').classList.remove('active'); }

    function handleFileSelect(e) { const f = e.target.files[0]; if (f) readImg(f); }
    function handleDrop(e) {
        e.preventDefault();
        document.getElementById('uploadDropzone').classList.remove('dragover');
        const f = e.dataTransfer.files[0];
        if (f && f.type.startsWith('image/')) readImg(f);
    }
    function readImg(file) {
        const r = new FileReader();
        r.onload = ev => {
            pendingPhotoData = ev.target.result;
            const p = document.getElementById('uploadPreview');
            p.src = pendingPhotoData; p.classList.add('show');
            document.getElementById('btnSave').disabled = false;
        };
        r.readAsDataURL(file);
    }
    async function savePhoto() {
        if (!pendingPhotoData) return;
        const loc = document.getElementById('locationInput').value.trim() || 'Onbekend';
        document.getElementById('btnSave').disabled = true;
        const id = await saveNewPhoto(pendingPhotoData, loc);
        if (id) { photos.unshift({ id, src: pendingPhotoData, location: loc }); updateHeaderPhoto(); closeUploadModal(); }
        else document.getElementById('btnSave').disabled = false;
    }
</script>

<!-- ─── CORE APP ─── -->
<script>
    // ── Constants ──
    const COUPLE_COLORS = [
        { solid: '#4285F4', light: 'rgba(66,133,244,0.22)' },
        { solid: '#34A853', light: 'rgba(52,168,83,0.22)' },
        { solid: '#FA7B17', light: 'rgba(250,123,23,0.22)' },
        { solid: '#9B59B6', light: 'rgba(155,89,182,0.22)' },
        { solid: '#E91E63', light: 'rgba(233,30,99,0.22)' },
    ];

    const MONTHS_FULL = ['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'];
    const MONTHS      = ['Jan','Feb','Mrt','Apr','Mei','Jun','Jul','Aug','Sep','Okt','Nov','Dec'];
    const DAYS_IN_MONTH = [31,28,31,30,31,30,31,31,30,31,30,31];

    const BELGIAN_HOLIDAYS = {
        '0-1':'Nieuwjaar','3-5':'Paaszondag','3-6':'Paasmaandag',
        '4-1':'Dag v/d Arbeid','4-14':'Hemelvaart',
        '4-24':'Pinksterzondag','4-25':'Pinkstermaandag',
        '6-21':'Nationale Feestdag','7-15':'O.L.V. Hemelvaart',
        '10-1':'Allerheiligen','10-11':'Wapenstilstand','11-25':'Kerstmis'
    };

    function isSchoolHoliday(m, d) {
        if (m===0 && d>=1 && d<=4)   return 'Kerstvakantie';
        if (m===1 && d>=16 && d<=22) return 'Krokusvakantie';
        if (m===2 && d>=30)          return 'Paasvakantie';
        if (m===3 && d>=1 && d<=12)  return 'Paasvakantie';
        if (m===4 && d>=14 && d<=17) return 'Hemelvaartsweekend';
        if (m===4 && d>=23 && d<=25) return 'Pinksterweekend';
        if (m===6 && d>=1)           return 'Zomervakantie';
        if (m===7)                   return 'Zomervakantie';
        if (m===10 && d>=2 && d<=8)  return 'Herfstvakantie';
        if (m===11 && d>=21)         return 'Kerstvakantie';
        return null;
    }
    function isWeekend(m, d) { const dow = new Date(2026,m,d).getDay(); return dow===0||dow===6; }

    // ── State ──
    const DEFAULT_COUPLES = ['Tobe & Nina','Arne & Margaux','Nick'];
    let couples = [...DEFAULT_COUPLES];
    let bookings = {}, labels = {}, shownLevelUps = new Set();
    let currentCalMonth = new Date().getMonth();
    let isSavingBookings = false;

    // ── Helpers ──
    function isBooked(ci, t, ds) { return (bookings[ci]?.[t]||[]).includes(ds); }
    function dateStrToIndex(d) {
        const [m,dy] = d.split('-').map(Number);
        let i=0; for(let x=0;x<m;x++) i+=DAYS_IN_MONTH[x]; return i+dy-1;
    }
    function indexToDateStr(i) {
        let r=i;
        for(let m=0;m<12;m++){ if(r<DAYS_IN_MONTH[m]) return `${m}-${r+1}`; r-=DAYS_IN_MONTH[m]; }
        return '11-31';
    }
    function getDateRange(a,b) {
        const ai=dateStrToIndex(a),bi=dateStrToIndex(b);
        const min=Math.min(ai,bi),max=Math.max(ai,bi);
        const r=[]; for(let i=min;i<=max;i++) r.push(indexToDateStr(i)); return r;
    }

    // ── Month navigation ──
    function prevMonth() { if(currentCalMonth>0){ currentCalMonth--; renderCalendar(); } }
    function nextMonth() { if(currentCalMonth<11){ currentCalMonth++; renderCalendar(); } }

    // ── Render ──
    function renderCalendar() {
        document.getElementById('monthNavLabel').textContent = MONTHS_FULL[currentCalMonth] + ' 2026';
        renderCoupleLegend();
        renderCalGrid();
    }

    function renderCoupleLegend() {
        const today = new Date();
        document.getElementById('coupleLegend').innerHTML = couples.map((name, ci) => {
            const col = COUPLE_COLORS[ci % COUPLE_COLORS.length];
            const locked = bookings[ci]?.locked || [];
            const tent = (bookings[ci]?.tentative||[]).length;
            let future = 0;
            locked.forEach(ds => { const [m,d]=ds.split('-').map(Number); if(new Date(2026,m,d)>=today) future++; });
            return `
                <div class="couple-legend-row" onclick="editCoupleNameInline(${ci}, event)">
                    <div class="couple-color-swatch" style="background:${col.solid}"></div>
                    <div class="couple-legend-name">${name}</div>
                    <div class="couple-legend-stats">${future} gepland · ${tent} misschien</div>
                </div>`;
        }).join('');
    }

    function renderCalGrid() {
        const m = currentCalMonth, daysInMonth = DAYS_IN_MONTH[m];
        const today = new Date(); today.setHours(0,0,0,0);
        const startOffset = (new Date(2026,m,1).getDay()+6)%7;
        let html = '';

        for(let i=0;i<startOffset;i++) html += '<div class="cal-day empty"></div>';

        for(let d=1;d<=daysInMonth;d++) {
            const ds = `${m}-${d}`;
            const dt = new Date(2026,m,d);
            const isToday = dt.getTime()===today.getTime();
            const isPast  = dt<today;
            const hol     = BELGIAN_HOLIDAYS[ds];
            const schoolHol = isSchoolHoliday(m,d);
            const wknd    = isWeekend(m,d);

            let cls = 'cal-day';
            if(wknd) cls += ' weekend';
            if(isToday) cls += ' today';
            if(isPast) cls += ' past';
            if(hol) cls += ' pub-hol';
            else if(schoolHol) cls += ' school-hol';

            html += `<div class="${cls}" onclick="onDayTap(${m},${d})">`;
            html += `<div class="day-num">${d}</div>`;
            if(hol) html += `<div class="day-hol-label">${hol}</div>`;
            else if(schoolHol) html += `<div class="day-school-dot"></div>`;

            const bars = [];
            couples.forEach((_,ci) => {
                const col = COUPLE_COLORS[ci % COUPLE_COLORS.length];
                if(isBooked(ci,'locked',ds)) {
                    bars.push(`<div class="booking-bar" style="background:${col.solid}"></div>`);
                } else if(isBooked(ci,'tentative',ds)) {
                    bars.push(`<div class="booking-bar" style="background:${col.light};outline:1px solid ${col.solid}55"></div>`);
                }
            });
            if(bars.length) html += `<div class="day-bars">${bars.join('')}</div>`;
            html += '</div>';
        }

        const total = startOffset + daysInMonth, rem = total%7;
        if(rem>0) for(let i=0;i<7-rem;i++) html += '<div class="cal-day empty"></div>';
        document.getElementById('calGrid').innerHTML = html;
    }

    // ── Day tap ──
    function onDayTap(m, d) {
        const ds = `${m}-${d}`;
        const hol = BELGIAN_HOLIDAYS[ds];
        const schoolHol = isSchoolHoliday(m,d);
        const dayBookings = [];
        couples.forEach((name,ci) => {
            if(isBooked(ci,'locked',ds)) dayBookings.push({ci,name,type:'locked'});
            else if(isBooked(ci,'tentative',ds)) dayBookings.push({ci,name,type:'tentative'});
        });

        // No bookings and no holidays → go straight to trip modal
        if(dayBookings.length===0 && !hol && !schoolHol) {
            openTripModalForDate(`2026-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
            return;
        }

        // Show day sheet
        document.getElementById('sheetDateTitle').textContent = `${d} ${MONTHS[m]} 2026`;
        const holEl = document.getElementById('sheetHolLabel');
        holEl.textContent = hol||''; holEl.style.display = hol ? 'block' : 'none';
        const schoolEl = document.getElementById('sheetSchoolLabel');
        schoolEl.textContent = schoolHol||''; schoolEl.style.display = schoolHol ? 'block' : 'none';

        const bEl = document.getElementById('sheetBookings');
        if(dayBookings.length===0) {
            bEl.innerHTML = '<div class="sheet-empty-msg">Nog niemand ingepland</div>';
        } else {
            bEl.innerHTML = dayBookings.map(b => {
                const col = COUPLE_COLORS[b.ci % COUPLE_COLORS.length];
                const label = b.type==='locked' ? 'Gaan we doen' : 'We zien wel';
                const dotStyle = b.type==='locked'
                    ? `background:${col.solid}`
                    : `background:${col.light};outline:2px solid ${col.solid}66;outline-offset:0`;
                return `
                    <div class="sheet-booking-row">
                        <div class="sheet-booking-dot" style="${dotStyle}"></div>
                        <div class="sheet-booking-info">
                            <div class="sheet-booking-name">${b.name}</div>
                            <div class="sheet-booking-type">${label}</div>
                        </div>
                        <button class="sheet-del-btn" onclick="deleteFromSheet(${b.ci},'${b.type}','${ds}')">×</button>
                    </div>`;
            }).join('');
        }

        const dateStr = `2026-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        document.getElementById('sheetAddBtn').onclick = () => { closeDaySheet(); openTripModalForDate(dateStr); };
        document.getElementById('daySheet').classList.add('active');
    }

    function closeDaySheet() { document.getElementById('daySheet').classList.remove('active'); }

    function deleteFromSheet(ci, type, ds) {
        const list = bookings[ci][type];
        const idx = list.indexOf(ds);
        if(idx>-1){ list.splice(idx,1); saveData(); renderCalendar(); }
        closeDaySheet();
    }

    // ── Trip modal ──
    function openTripModal() {
        document.getElementById('tripCouple').innerHTML = couples.map((c,i)=>`<option value="${i}">${c}</option>`).join('');
        document.getElementById('tripType').value = 'tentative';
        document.getElementById('tripStartDate').value = '';
        document.getElementById('tripEndDate').value = '';
        document.getElementById('tripDescription').value = '';
        document.getElementById('tripModal').classList.add('active');
    }

    function openTripModalForDate(dateStr) {
        document.getElementById('tripCouple').innerHTML = couples.map((c,i)=>`<option value="${i}">${c}</option>`).join('');
        document.getElementById('tripType').value = 'tentative';
        document.getElementById('tripStartDate').value = dateStr;
        document.getElementById('tripEndDate').value = dateStr;
        document.getElementById('tripDescription').value = '';
        document.getElementById('tripModal').classList.add('active');
    }

    function closeTripModal() { document.getElementById('tripModal').classList.remove('active'); }

    function saveTrip() {
        const ci   = parseInt(document.getElementById('tripCouple').value);
        const type = document.getElementById('tripType').value;
        const s    = document.getElementById('tripStartDate').value;
        const e    = document.getElementById('tripEndDate').value;
        const desc = document.getElementById('tripDescription').value.trim().toUpperCase();

        if(!s||!e){ alert('Selecteer start- en einddatum'); return; }
        const start = new Date(s), end = new Date(e);
        if(end<start){ alert('Einddatum moet na startdatum zijn'); return; }

        const cur = new Date(start); let isFirst = true;
        while(cur<=end) {
            const m=cur.getMonth(), d=cur.getDate(), ds=`${m}-${d}`;
            if(!bookings[ci][type].includes(ds)) bookings[ci][type].push(ds);
            if(type==='locked'){
                const ti = bookings[ci].tentative.indexOf(ds);
                if(ti>-1) bookings[ci].tentative.splice(ti,1);
            }
            if(isFirst&&desc){ labels[ci][ds]=desc; isFirst=false; }
            cur.setDate(cur.getDate()+1);
        }
        saveData(); renderCalendar(); closeTripModal();
        if(type==='locked'){
            const c2=new Date(start);
            while(c2<=end){ const m=c2.getMonth(),d=c2.getDate(); setTimeout(()=>checkLevelUp(`${m}-${d}`),80); c2.setDate(c2.getDate()+1); }
        }
    }

    // ── Couple name edit ──
    function editCoupleNameInline(ci, e) {
        const row = e.currentTarget;
        const nameEl = row.querySelector('.couple-legend-name');
        const cur = couples[ci];
        const inp = document.createElement('input');
        inp.value = cur;
        inp.style.cssText = 'background:transparent;border:none;border-bottom:1px solid rgba(0,0,0,0.4);font-family:inherit;font-size:0.58rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;outline:none;width:120px;color:#1a1a1a;';
        nameEl.replaceWith(inp); inp.focus(); inp.select();
        const save = () => { couples[ci]=inp.value.trim()||DEFAULT_COUPLES[ci]; saveData(); renderCalendar(); };
        inp.onblur = save;
        inp.onkeydown = ev => { if(ev.key==='Enter') inp.blur(); if(ev.key==='Escape'){inp.value=cur;inp.blur();} };
        e.stopPropagation();
    }

    // ── Level-up ──
    function checkLevelUp(ds) {
        if(couples.every((_,i)=>isBooked(i,'locked',ds))&&!shownLevelUps.has(ds)){
            shownLevelUps.add(ds); saveData(); showLevelUp(ds);
        }
    }

    function showLevelUp(ds) {
        const [m,d] = ds.split('-').map(Number);
        document.getElementById('levelUpDate').textContent = `${d} ${MONTHS[m]} 2026`;
        const ov=document.getElementById('levelUpOverlay');
        const van=document.getElementById('van'), tm=document.getElementById('tireMarks');
        const dc=document.getElementById('dustCloud'), tx=document.getElementById('levelUpText');
        const dt=document.getElementById('levelUpDate');
        [van,tm,dc,tx,dt].forEach(el=>el.classList.remove('spinning','show','puff'));
        ov.classList.add('active');
        setTimeout(()=>{ van.classList.add('spinning'); playTireSound(); },100);
        setTimeout(()=>tm.classList.add('show'),200);
        setTimeout(()=>dc.classList.add('puff'),300);
        setTimeout(()=>playHonkSound(),800);
        setTimeout(()=>{ tx.classList.add('show'); dt.classList.add('show'); },1200);
    }

    function closeLevelUp() { document.getElementById('levelUpOverlay').classList.remove('active'); }

    // ── Swipe between months ──
    let swipeX=0, swipeY=0;
    document.addEventListener('touchstart', e=>{ swipeX=e.touches[0].clientX; swipeY=e.touches[0].clientY; },{passive:true});
    document.addEventListener('touchend', e=>{
        const anyOpen = document.querySelector('.day-sheet.active,.modal-overlay.active,.upload-modal.active,.level-up-overlay.active');
        if(anyOpen) return;
        const dx = swipeX - e.changedTouches[0].clientX;
        const dy = Math.abs(swipeY - e.changedTouches[0].clientY);
        if(Math.abs(dx)>55 && dy<90){ if(dx>0) nextMonth(); else prevMonth(); }
    },{passive:true});

    // ── Firebase ──
    async function loadData() {
        try {
            const doc = await db.collection('wezienwel').doc('bookings').get();
            if(doc.exists){
                const d=doc.data();
                couples=d.couples||[...DEFAULT_COUPLES];
                bookings=d.bookings||{};
                labels=d.labels||{};
                shownLevelUps=new Set(d.shownLevelUps||[]);
            }
        } catch(e) {
            const s=localStorage.getItem('wezienwel_light_v1');
            if(s){ const d=JSON.parse(s); couples=d.couples||[...DEFAULT_COUPLES]; bookings=d.bookings||{}; labels=d.labels||{}; shownLevelUps=new Set(d.shownLevelUps||[]); }
        }
        couples.forEach((_,i)=>{ if(!bookings[i]) bookings[i]={tentative:[],locked:[]}; if(!labels[i]) labels[i]={}; });
    }

    async function saveData() {
        const data={couples,bookings,labels,shownLevelUps:[...shownLevelUps]};
        localStorage.setItem('wezienwel_light_v1',JSON.stringify(data));
        isSavingBookings=true;
        try { await db.collection('wezienwel').doc('bookings').set(data); } catch(e){}
        setTimeout(()=>{ isSavingBookings=false; },1000);
    }

    async function init() {
        await loadPhotos(); updateHeaderPhoto();
        await loadData(); renderCalendar();

        db.collection('wezienwel').doc('bookings').onSnapshot(doc=>{
            if(isSavingBookings) return;
            if(doc.exists){
                const d=doc.data();
                couples=d.couples||[...DEFAULT_COUPLES]; bookings=d.bookings||{}; labels=d.labels||{}; shownLevelUps=new Set(d.shownLevelUps||[]);
                couples.forEach((_,i)=>{ if(!bookings[i]) bookings[i]={tentative:[],locked:[]}; if(!labels[i]) labels[i]={}; });
                renderCalendar();
            }
        });

        db.collection('wezienwel_photos').orderBy('timestamp','desc').onSnapshot(snap=>{
            if(isSavingPhotos) return;
            photos=[];
            snap.forEach(doc=>{ const d=doc.data(); photos.push({id:doc.id,src:d.src,location:d.location}); });
            updateHeaderPhoto();
        });
    }
</script>

<!-- ─── FUEL TRACKER ─── -->
<script>
    let fuelEntries=[], currentFuelType='drive', isSavingFuel=false, fuelHistoryExpanded=false;

    async function loadFuelEntries() {
        try {
            const snap=await db.collection('wezienwel_fuel').orderBy('timestamp','desc').get();
            fuelEntries=[];
            snap.forEach(doc=>fuelEntries.push({id:doc.id,...doc.data()}));
        } catch(e){}
    }

    function openFuelModal(type) {
        currentFuelType=type;
        document.getElementById('fuelModalTitle').textContent = type==='drive' ? 'Ritje toevoegen' : 'Tanken toevoegen';
        document.getElementById('fuelKmGroup').style.display     = type==='drive'   ? 'block':'none';
        document.getElementById('fuelNoteGroup').style.display   = type==='drive'   ? 'block':'none';
        document.getElementById('fuelAmountGroup').style.display = type==='refill'  ? 'block':'none';
        document.getElementById('fuelCouple').innerHTML = couples.map((c,i)=>`<option value="${i}">${c}</option>`).join('');
        if(type==='drive'){ document.getElementById('fuelKm').value=''; document.getElementById('fuelNote').value=''; }
        else document.getElementById('fuelAmount').value='';
        document.getElementById('fuelModal').classList.add('active');
    }
    function closeFuelModal() { document.getElementById('fuelModal').classList.remove('active'); }

    async function saveFuelEntry() {
        const ci=parseInt(document.getElementById('fuelCouple').value);
        let entry={coupleIdx:ci,coupleName:couples[ci],type:currentFuelType,timestamp:firebase.firestore.FieldValue.serverTimestamp(),date:new Date().toISOString()};
        if(currentFuelType==='drive'){
            const km=parseFloat(document.getElementById('fuelKm').value);
            if(!km||km<=0){ alert('Vul een geldige afstand in'); return; }
            entry.km=km;
            const note=document.getElementById('fuelNote').value.trim(); if(note) entry.note=note;
        } else {
            const amount=parseFloat(document.getElementById('fuelAmount').value);
            if(!amount||amount<=0){ alert('Vul een geldig bedrag in'); return; }
            entry.amount=amount;
        }
        isSavingFuel=true;
        try {
            const ref=await db.collection('wezienwel_fuel').add(entry);
            entry.id=ref.id; fuelEntries.unshift(entry); renderFuelTracker(); closeFuelModal();
        } catch(e){ alert('Error: '+e.message); }
        setTimeout(()=>{ isSavingFuel=false; },1000);
    }

    async function deleteFuelEntry(id) {
        if(!confirm('Verwijderen?')) return;
        try { await db.collection('wezienwel_fuel').doc(id).delete(); fuelEntries=fuelEntries.filter(e=>e.id!==id); renderFuelTracker(); } catch(e){}
    }

    function calculateFuelBalances() {
        const km={},paid={};
        couples.forEach((_,i)=>{ km[i]=0; paid[i]=0; });
        let totalKm=0,totalPaid=0;
        fuelEntries.forEach(e=>{
            if(e.type==='drive'&&e.km){ km[e.coupleIdx]=(km[e.coupleIdx]||0)+e.km; totalKm+=e.km; }
            else if(e.type==='refill'&&e.amount){ paid[e.coupleIdx]=(paid[e.coupleIdx]||0)+e.amount; totalPaid+=e.amount; }
        });
        const balances={};
        couples.forEach((name,i)=>{ const share=totalKm>0?(km[i]/totalKm)*totalPaid:0; balances[i]={name,km:km[i],paid:paid[i],balance:paid[i]-share}; });
        return balances;
    }

    function renderFuelTracker() {
        const b=calculateFuelBalances();
        document.getElementById('fuelBalances').innerHTML=couples.map((name,i)=>{
            const bl=b[i], sign=bl.balance>=0?'+':'';
            return `<div class="fuel-balance-card">
                <div class="fuel-balance-name">${name}</div>
                <div class="fuel-balance-amount ${bl.balance>=0?'positive':'negative'}">${sign}€${bl.balance.toFixed(2)}</div>
                <div class="fuel-balance-details">${bl.km.toFixed(0)} km · €${bl.paid.toFixed(2)} betaald</div>
            </div>`;
        }).join('');

        const hist=document.getElementById('fuelHistory'), btn=document.getElementById('fuelHistoryToggle');
        if(fuelEntries.length===0){
            hist.innerHTML='<div style="font-size:0.62rem;color:rgba(0,0,0,0.36);padding:8px 0;">Nog geen ritten of tankbeurten</div>';
            btn.style.display='none';
        } else {
            const items=fuelHistoryExpanded?fuelEntries:fuelEntries.slice(0,3);
            hist.innerHTML=items.map(entry=>{
                const date=entry.date?new Date(entry.date).toLocaleDateString('nl-BE'):'';
                const info=entry.type==='drive'
                    ?`🚗 ${entry.coupleName} — ${entry.km} km${entry.note?' · '+entry.note:''}`
                    :`⛽ ${entry.coupleName} — €${entry.amount?.toFixed(2)}`;
                return `<div class="fuel-history-item">
                    <div class="fuel-history-info">
                        <div class="fuel-history-type">${info}</div>
                        <div class="fuel-history-meta">${date}</div>
                    </div>
                    <button class="fuel-history-delete" onclick="deleteFuelEntry('${entry.id}')">×</button>
                </div>`;
            }).join('');
            btn.style.display=fuelEntries.length>3?'block':'none';
            btn.textContent=fuelHistoryExpanded?'Toon minder':`Toon meer (${fuelEntries.length-3})`;
        }
    }

    function toggleFuelHistory(){ fuelHistoryExpanded=!fuelHistoryExpanded; renderFuelTracker(); }

    // Close modals on overlay tap
    document.getElementById('fuelModal').addEventListener('click',e=>{ if(e.target===document.getElementById('fuelModal')) closeFuelModal(); });
    document.getElementById('tripModal').addEventListener('click',e=>{ if(e.target===document.getElementById('tripModal')) closeTripModal(); });

    // ── Boot ──
    (async function boot() {
        await init();
        await loadFuelEntries();
        renderFuelTracker();
        db.collection('wezienwel_fuel').orderBy('timestamp','desc').onSnapshot(snap=>{
            if(isSavingFuel) return;
            fuelEntries=[];
            snap.forEach(doc=>fuelEntries.push({id:doc.id,...doc.data()}));
            renderFuelTracker();
        });
    })();
</script>
