        /* Level Up Easter Egg - Van Donuts Style */
        .level-up-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.95);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .level-up-overlay.active {
            display: flex;
        }

        .van-scene {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .donut-track {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            transform: translate(-50%, -50%);
            border: 3px dashed rgba(0,0,0,0.2);
            border-radius: 50%;
        }

        .van {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 32px;
            transform-origin: center center;
            opacity: 0;
        }

        .van.spinning {
            animation: vanDonut 2.5s ease-in-out forwards;
        }

        @keyframes vanDonut {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(0deg) translateX(60px) rotate(0deg);
            }
            15% {
                transform: translate(-50%, -50%) rotate(180deg) translateX(60px) rotate(-180deg);
            }
            30% {
                transform: translate(-50%, -50%) rotate(360deg) translateX(60px) rotate(-360deg);
            }
            45% {
                transform: translate(-50%, -50%) rotate(540deg) translateX(60px) rotate(-540deg);
            }
            60% {
                transform: translate(-50%, -50%) rotate(720deg) translateX(60px) rotate(-720deg);
            }
            75% {
                transform: translate(-50%, -50%) rotate(900deg) translateX(60px) rotate(-900deg);
            }
            90% {
                transform: translate(-50%, -50%) rotate(1080deg) translateX(60px) rotate(-1080deg);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(1080deg) translateX(60px) rotate(-1080deg);
            }
        }

        .tire-marks {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 110px;
            height: 110px;
            transform: translate(-50%, -50%);
            border: 4px solid transparent;
            border-radius: 50%;
            opacity: 0;
        }

        .tire-marks.show {
            animation: tireMarks 2s ease-out forwards;
        }

        @keyframes tireMarks {
            0% { opacity: 0; border-color: transparent; }
            20% { opacity: 0.6; border-color: rgba(0,0,0,0.3); }
            100% { opacity: 0.3; border-color: rgba(0,0,0,0.15); }
        }

        .dust-cloud {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            opacity: 0;
        }

        .dust-cloud.puff {
            animation: dustPuff 0.8s ease-out forwards;
        }

        @keyframes dustPuff {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            30% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(2); }
        }

        .level-up-text {
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;

        .level-up-text.show {

        @keyframes textFadeIn {

    <script>
        let audioCtx = null;

        function playHonkSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            // Car horn sound
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.type = 'sawtooth';
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);

            // Second honk
            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2); gain2.connect(audioCtx.destination);
                osc2.frequency.setValueAtTime(450, audioCtx.currentTime);
                osc2.type = 'sawtooth';
                gain2.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc2.start(); osc2.stop(audioCtx.currentTime + 0.4);
            }, 350);
        }

        function playTireSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            // Tire screech noise
            const bufferSize = audioCtx.sampleRate * 0.8;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 2000;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }
    </script>

    <script>
        // Photo Carousel System
        let photos = [];
        let currentSlide = 0;
        let pendingPhotoData = null;
        let autoSlideInterval = null;
        let isSavingPhotos = false;

        async function loadPhotos() {
            try {
                const snapshot = await db.collection('wezienwel_photos').orderBy('timestamp', 'desc').get();
                photos = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    photos.push({ id: doc.id, src: data.src, location: data.location });
                });
            } catch (e) {
                console.error('Error loading photos:', e);
                // Fallback to localStorage
                const saved = localStorage.getItem('wezienwel_photos_v1');
                if (saved) photos = JSON.parse(saved);
            }
        }

        async function saveNewPhoto(photoData, location) {
            isSavingPhotos = true;
            try {
                const docRef = await db.collection('wezienwel_photos').add({
                    src: photoData,
                    location: location,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                console.log('Photo saved successfully with ID:', docRef.id);
                return docRef.id;
            } catch (e) {
                console.error('Error saving photo:', e);
                alert('Error saving photo: ' + e.message);
                return null;
            } finally {
                setTimeout(() => { isSavingPhotos = false; }, 1000);
            }
        }

        async function deletePhotoFromDb(photoId) {
            if (!photoId) return;
            try {
                await db.collection('wezienwel_photos').doc(photoId).delete();
                console.log('Photo deleted:', photoId);
            } catch (e) {
                console.error('Error deleting photo:', e);
            }
        }

        function renderCarousel() {
            const container = document.getElementById('carouselContainer');
            const dotsContainer = document.getElementById('carouselDots');

            if (photos.length === 0) {
                // Empty state - prompt to upload
                container.innerHTML = `
                    <div class="panorama-slide empty-state">
                        <div class="empty-state-content">
                            <div class="empty-state-icon">📷</div>
                            <p>Voeg je eerste foto toe</p>
                        </div>
                    </div>
                `;
                dotsContainer.innerHTML = '';
                return;
            }

            container.innerHTML = photos.map((p, i) => `
                <div class="panorama-slide">
                    <img src="${p.src}" class="panorama-img" alt="${p.location}">
                    <div class="panorama-location">${p.location}</div>
                    <button class="panorama-delete" onclick="deletePhoto(${i}, event)">×</button>
                </div>
            `).join('');

            dotsContainer.innerHTML = photos.map((_, i) => `
                <div class="carousel-dot ${i === currentSlide ? 'active' : ''}" onclick="goToSlide(${i})"></div>
            `).join('');

            updateCarouselPosition();
            startAutoSlide();
        }

        function updateCarouselPosition() {
            const container = document.getElementById('carouselContainer');
            container.style.transform = `translateX(-${currentSlide * 100}%)`;

            document.querySelectorAll('.carousel-dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === currentSlide);
            });
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % photos.length;
            updateCarouselPosition();
            resetAutoSlide();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + photos.length) % photos.length;
            updateCarouselPosition();
            resetAutoSlide();
        }

        function goToSlide(i) {
            currentSlide = i;
            updateCarouselPosition();
            resetAutoSlide();
        }

        function startAutoSlide() {
            if (autoSlideInterval) clearInterval(autoSlideInterval);
            autoSlideInterval = setInterval(nextSlide, 6000);
        }

        function resetAutoSlide() {
            startAutoSlide();
        }

        async function deletePhoto(index, e) {
            e.stopPropagation();
            if (!confirm('Foto verwijderen?')) return;
            const photo = photos[index];
            if (photo.id) {
                await deletePhotoFromDb(photo.id);
            }
            photos.splice(index, 1);
            if (currentSlide >= photos.length) currentSlide = Math.max(0, photos.length - 1);
            renderCarousel();
        }

        // Upload Modal
        function openUploadModal() {
            document.getElementById('uploadModal').classList.add('active');
            document.getElementById('uploadPreview').classList.remove('show');
            document.getElementById('locationInput').value = '';
            document.getElementById('btnSave').disabled = true;
            pendingPhotoData = null;
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('active');
            pendingPhotoData = null;
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            processFile(file);
        }

        function processFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Selecteer een afbeelding');
                return;
            }

            // Compress image to fit within Firestore limits
            const img = new Image();
            const reader = new FileReader();

            reader.onload = (e) => {
                img.onload = () => {
                    // Resize to max 1200px width while maintaining aspect ratio
                    const maxWidth = 1200;
                    const maxHeight = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = (height * maxWidth) / width;
                        width = maxWidth;
                    }
                    if (height > maxHeight) {
                        width = (width * maxHeight) / height;
                        height = maxHeight;
                    }

                    // Draw to canvas and compress as JPEG
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Compress to JPEG with 0.7 quality (~50-100KB typically)
                    pendingPhotoData = canvas.toDataURL('image/jpeg', 0.7);

                    const preview = document.getElementById('uploadPreview');
                    preview.src = pendingPhotoData;
                    preview.classList.add('show');
                    checkSaveEnabled();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function checkSaveEnabled() {
            const hasPhoto = pendingPhotoData !== null;
            const hasLocation = document.getElementById('locationInput').value.trim().length > 0;
            document.getElementById('btnSave').disabled = !(hasPhoto && hasLocation);
        }

        async function savePhoto() {
            const location = document.getElementById('locationInput').value.trim();
            if (!pendingPhotoData || !location) return;

            // Save to Firebase first
            const photoId = await saveNewPhoto(pendingPhotoData, location);

            if (photoId) {
                photos.unshift({
                    id: photoId,
                    src: pendingPhotoData,
                    location: location
                });
                currentSlide = 0;
                renderCarousel();
            }
            closeUploadModal();
        }

        // Setup dropzone
        document.addEventListener('DOMContentLoaded', () => {
            const dropzone = document.getElementById('dropzone');
            const locationInput = document.getElementById('locationInput');

            dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropzone.classList.add('dragover');
            });

            dropzone.addEventListener('dragleave', () => {
                dropzone.classList.remove('dragover');
            });

            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file) processFile(file);
            });

            locationInput.addEventListener('input', checkSaveEnabled);

            // Close modal on outside click
            document.getElementById('uploadModal').addEventListener('click', (e) => {
                if (e.target.id === 'uploadModal') closeUploadModal();
            });
        });
    </script>

    <script>
        // Progressive quotes - getting darker with each click
        const QUOTE_STAGES = [
            ["The road less traveled is less traveled for a reason."],
            ["Adventure awaits. So does laundry."],
            ["Not all who wander are lost. Some are just avoiding home."],
            ["Collect moments, not things. Moments fade too."],
            ["Escape the ordinary. The ordinary always finds you."],
            ["The horizon keeps moving. So do you. Why?"]
        ];

        let quoteStage = 0;
        let quoteIndex = 0;

        function cycleQuote() {
            const el = document.getElementById('dailyQuote');
            if (quoteStage >= QUOTE_STAGES.length - 1) {
                el.classList.add('exhausted');
                return;
            }
            quoteStage++;
            el.style.opacity = '0';
            setTimeout(() => {
                el.textContent = QUOTE_STAGES[quoteStage][0];
                el.style.opacity = '';
            }, 150);
        }

        function setInitialQuote() {
            document.getElementById('dailyQuote').textContent = QUOTE_STAGES[0][0];
        }

        const BELGIAN_HOLIDAYS = {
            '0-1': 'Nieuwjaar', '3-5': 'Paaszondag', '3-6': 'Paasmaandag',
            '4-1': 'Dag van de Arbeid', '4-14': 'O.L.H. Hemelvaart',
            '4-24': 'Pinksterzondag', '4-25': 'Pinkstermaandag',
            '6-21': 'Nationale Feestdag', '7-15': 'O.L.V. Hemelvaart',
            '10-1': 'Allerheiligen', '10-11': 'Wapenstilstand', '11-25': 'Kerstmis'
        };

        // Belgian school holidays 2026 (Flemish community)
        function isSchoolHoliday(m, d) {
            // Kerstvakantie 2025-2026: Dec 22, 2025 - Jan 4, 2026
            if (m === 0 && d >= 1 && d <= 4) return 'Kerstvakantie';
            // Krokusvakantie: Feb 16-22, 2026
            if (m === 1 && d >= 16 && d <= 22) return 'Krokusvakantie';
            // Paasvakantie: Mar 30 - Apr 12, 2026
            if (m === 2 && d >= 30 && d <= 31) return 'Paasvakantie';
            if (m === 3 && d >= 1 && d <= 12) return 'Paasvakantie';
            // Hemelvaartsweekend: May 14-17, 2026
            if (m === 4 && d >= 14 && d <= 17) return 'Hemelvaartsweekend';
            // Pinksterweekend: May 23-25, 2026
            if (m === 4 && d >= 23 && d <= 25) return 'Pinksterweekend';
            // Zomervakantie: Jul 1 - Aug 31, 2026
            if (m === 6 && d >= 1) return 'Zomervakantie';
            if (m === 7) return 'Zomervakantie';
            // Herfstvakantie: Nov 2-8, 2026
            if (m === 10 && d >= 2 && d <= 8) return 'Herfstvakantie';
            // Kerstvakantie 2026-2027: Dec 21 - Jan 3
            if (m === 11 && d >= 21) return 'Kerstvakantie';
            return null;
        }

        const DEFAULT_COUPLES = ['Tobe & Nina', 'Arne & Margaux', 'Nick'];
        let couples = [...DEFAULT_COUPLES];
        let currentCouple = 0;
        let bookings = {};
        let labels = {};
        let shownLevelUps = new Set();
        let isDragging = false, dragStartDate = null, dragEndDate = null, dragType = null, dragCouple = null;
        let currentMobileMonth = 0;
        const MONTHS = ['Jan', 'Feb', 'Mrt', 'Apr', 'Mei', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dec'];
        const DAYS_IN_MONTH = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

        function isMobile() {
            return window.innerWidth <= 768;
        }

        function prevMonth() {
            if (currentMobileMonth > 0) {
                currentMobileMonth--;
                updateMobileMonth();
            }
        }

        function nextMonth() {
            if (currentMobileMonth < 11) {
                currentMobileMonth++;
                updateMobileMonth();
            }
        }

        function updateMobileMonth() {
            document.getElementById('mobileMonthName').textContent = MONTHS[currentMobileMonth];
        }

        function dateStrToIndex(d) {
            const [m, dy] = d.split('-').map(Number);
            let i = 0; for (let x = 0; x < m; x++) i += DAYS_IN_MONTH[x];
            return i + dy - 1;
        }
        function indexToDateStr(i) {
            let r = i;
            for (let m = 0; m < 12; m++) {
                if (r < DAYS_IN_MONTH[m]) return `${m}-${r + 1}`;
                r -= DAYS_IN_MONTH[m];
            }
            return '11-31';
        }
        function getDateRange(a, b) {
            const ai = dateStrToIndex(a), bi = dateStrToIndex(b);
            const min = Math.min(ai, bi), max = Math.max(ai, bi);
            const r = []; for (let i = min; i <= max; i++) r.push(indexToDateStr(i));
            return r;
        }
        function isWeekend(m, d) { const dt = new Date(2026, m, d); return dt.getDay() === 0 || dt.getDay() === 6; }

        // Flags to prevent re-render during local changes
        let isSavingBookings = false;
        let isTypingLabel = false;

        async function init() {
            setInitialQuote();
            await loadPhotos();
            renderCarousel();
            await loadData();
            render();
            setupEventListeners();

            // Listen for real-time updates from other devices
            db.collection('wezienwel').doc('bookings').onSnapshot((doc) => {
                // Skip if we just saved locally or user is typing
                if (isSavingBookings || isTypingLabel) return;
                if (doc.exists) {
                    const d = doc.data();
                    couples = d.couples || [...DEFAULT_COUPLES];
                    bookings = d.bookings || {};
                    labels = d.labels || {};
                    shownLevelUps = new Set(d.shownLevelUps || []);
                    couples.forEach((_, i) => {
                        if (!bookings[i]) bookings[i] = { tentative: [], locked: [] };
                        if (!labels[i]) labels[i] = {};
                    });
                    render();
                }
            });

            db.collection('wezienwel_photos').orderBy('timestamp', 'desc').onSnapshot((snapshot) => {
                // Skip if we just saved locally
                if (isSavingPhotos) return;
                photos = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    photos.push({ id: doc.id, src: data.src, location: data.location });
                });
                renderCarousel();
            });
        }

        async function loadData() {
            try {
                const doc = await db.collection('wezienwel').doc('bookings').get();
                if (doc.exists) {
                    const d = doc.data();
                    couples = d.couples || [...DEFAULT_COUPLES];
                    bookings = d.bookings || {};
                    labels = d.labels || {};
                    shownLevelUps = new Set(d.shownLevelUps || []);
                }
            } catch (e) {
                console.error('Error loading data:', e);
                // Fallback to localStorage
                const s = localStorage.getItem('wezienwel_light_v1');
                if (s) {
                    const d = JSON.parse(s);
                    couples = d.couples || [...DEFAULT_COUPLES];
                    bookings = d.bookings || {};
                    labels = d.labels || {};
                    shownLevelUps = new Set(d.shownLevelUps || []);
                }
            }
            couples.forEach((_, i) => {
                if (!bookings[i]) bookings[i] = { tentative: [], locked: [] };
                if (!labels[i]) labels[i] = {};
            });
        }

        async function saveData() {
            const data = {
                couples, bookings, labels, shownLevelUps: [...shownLevelUps]
            };
            localStorage.setItem('wezienwel_light_v1', JSON.stringify(data));
            isSavingBookings = true;
            try {
                await db.collection('wezienwel').doc('bookings').set(data);
            } catch (e) {
                console.error('Error saving data:', e);
            }
            // Reset flag after a short delay to allow snapshot to fire
            setTimeout(() => { isSavingBookings = false; }, 1000);
        }

        function setupEventListeners() {
            document.addEventListener('keydown', e => {
                if (e.key >= '1' && e.key <= '3' && document.activeElement.tagName !== 'INPUT')
                    selectCouple(parseInt(e.key) - 1);
            });
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
        }

        function endDrag() {
            if (isDragging && dragStartDate && dragEndDate) finishDragSelection();
            isDragging = false; dragStartDate = null; dragEndDate = null;
            clearDragHighlights();
        }

        function selectCouple(i) { currentCouple = i; render(); }
        function render() { renderStats(); renderTimeline(); }

        function editCoupleName(i, el) {
            const cur = couples[i];
            const inp = document.createElement('input');
            inp.type = 'text'; inp.className = 'couple-name-input'; inp.value = cur;
            el.replaceWith(inp); inp.focus(); inp.select();
            const save = () => { couples[i] = inp.value.trim() || DEFAULT_COUPLES[i]; saveData(); render(); };
            inp.onblur = save;
            inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); if (e.key === 'Escape') { inp.value = cur; inp.blur(); } };
        }

        function renderStats() {
            const c = document.getElementById('statsRow');
            const today = new Date();
            c.innerHTML = couples.map((n, i) => {
                const tent = (bookings[i]?.tentative || []).length;
                const lock = bookings[i]?.locked || [];
                let past = 0, future = 0;
                lock.forEach(ds => {
                    const [m, d] = ds.split('-').map(Number);
                    if (new Date(2026, m, d) < today) past++; else future++;
                });
                return `<div class="stat-group ${i === currentCouple ? 'active' : ''}" onclick="selectCouple(${i})">
                    <div class="stat-name" onclick="event.stopPropagation(); editCoupleName(${i}, this)">${n}</div>
                    <div class="stat-numbers">
                        <div class="stat-item"><div class="stat-value">${past}</div><div class="stat-label">Goe gehad</div></div>
                        <div class="stat-item"><div class="stat-value">${future}</div><div class="stat-label">Gaan we doen</div></div>
                        <div class="stat-item"><div class="stat-value">${tent}</div><div class="stat-label">We zien wel</div></div>
                    </div></div>`;
            }).join('');
        }

        function isBooked(ci, t, ds) { return (bookings[ci]?.[t] || []).includes(ds); }

        function checkLevelUp(ds) {
            if (couples.every((_, i) => isBooked(i, 'locked', ds)) && !shownLevelUps.has(ds)) {
                shownLevelUps.add(ds); saveData(); showLevelUp(ds);
            }
        }

        function showLevelUp(ds) {
            const [m, d] = ds.split('-').map(Number);
            document.getElementById('levelUpDate').textContent = `${d} ${MONTHS[m]} 2026`;
            const ov = document.getElementById('levelUpOverlay');
            const van = document.getElementById('van');
            const tireMarks = document.getElementById('tireMarks');
            const dustCloud = document.getElementById('dustCloud');
            const tx = document.getElementById('levelUpText');
            const dt = document.getElementById('levelUpDate');

            van.classList.remove('spinning');
            tireMarks.classList.remove('show');
            dustCloud.classList.remove('puff');
            tx.classList.remove('show');
            dt.classList.remove('show');

            ov.classList.add('active');

            setTimeout(() => {
                van.classList.add('spinning');
                playTireSound();
            }, 100);
            setTimeout(() => tireMarks.classList.add('show'), 200);
            setTimeout(() => dustCloud.classList.add('puff'), 300);
            setTimeout(() => playHonkSound(), 800);
            setTimeout(() => { tx.classList.add('show'); dt.classList.add('show'); }, 1200);
        }

        function closeLevelUp() { document.getElementById('levelUpOverlay').classList.remove('active'); }

        function renderTimeline() {
            const c = document.getElementById('timeline');
            const today = new Date();
            let h = '<div class="month-headers"><div class="month-headers-spacer"></div>';
            MONTHS.forEach((m, i) => { h += `<div class="month-header" style="width:${DAYS_IN_MONTH[i] * 11}px">${m}</div>`; });
            h += '</div>';

            couples.forEach((n, ci) => {
                const act = ci === currentCouple;
                // Calculate stats for inline display
                const tent = (bookings[ci]?.tentative || []).length;
                const lock = bookings[ci]?.locked || [];
                let past = 0, future = 0;
                lock.forEach(ds => {
                    const [m, d] = ds.split('-').map(Number);
                    if (new Date(2026, m, d) < today) past++; else future++;
                });

                h += `<div class="couple-section ${act ? 'active' : ''}">`;
                h += `<div class="couple-name" onclick="editCoupleName(${ci}, this)">${n}<span class="couple-stats-inline"> · ${past} goe gehad · ${future} gaan we doen · ${tent} we zien wel</span></div>`;
                // Mobile stats grid (hidden on desktop via CSS)
                h += `<div class="mobile-stats-grid">
                    <div class="mobile-stat-item"><div class="mobile-stat-value">${past}</div><div class="mobile-stat-label">Goe gehad</div></div>
                    <div class="mobile-stat-item"><div class="mobile-stat-value">${future}</div><div class="mobile-stat-label">Gaan we doen</div></div>
                    <div class="mobile-stat-item"><div class="mobile-stat-value">${tent}</div><div class="mobile-stat-label">We zien wel</div></div>
                </div>`;

                ['tentative', 'locked'].forEach(type => {
                    const lbl = type === 'tentative' ? 'We zien wel' : 'Gaan we doen';
                    h += `<div class="timeline-row"><div class="row-label">${lbl}</div><div class="days-container">`;
                    MONTHS.forEach((_, mi) => {
                        for (let d = 1; d <= DAYS_IN_MONTH[mi]; d++) {
                            const ds = `${mi}-${d}`;
                            const dt = new Date(2026, mi, d);
                            const isPast = dt < today, tod = dt.toDateString() === today.toDateString();
                            const booked = isBooked(ci, type, ds);
                            const we = isWeekend(mi, d), hol = BELGIAN_HOLIDAYS[ds];
                            const schoolHol = isSchoolHoliday(mi, d);
                            let cls = 'day-cell';
                            if (we) cls += ' weekend'; if (hol) cls += ' holiday';
                            if (schoolHol) cls += ' school-holiday';
                            if (booked) cls += type === 'tentative' ? ' tentative' : ' locked';
                            if (isPast) cls += ' past'; if (tod) cls += ' today';
                            h += `<div class="${cls}" data-couple="${ci}" data-type="${type}" data-date="${ds}"
                                data-display="${d} ${MONTHS[mi]} 2026" data-holiday="${hol || ''}" data-schoolholiday="${schoolHol || ''}"
                                onmousedown="startDrag(${ci},'${type}','${ds}',event)"
                                ontouchstart="handleTouch(${ci},'${type}','${ds}',event)"
                                onmouseenter="continueDrag('${ds}',event)"
                                onmouseenter="showTooltip(event)" onmouseleave="hideTooltip()"></div>`;
                        }
                    });
                    h += '</div></div>';
                });

                // Single continuous label input
                const labelStr = getLabelString(ci);
                h += `<div class="label-row"><div class="row-label"></div><div class="label-input-container">`;
                h += `<input type="text" class="label-full-input" value="${labelStr}"
                    data-couple="${ci}"
                    onkeydown="handleLabelKeydown(event, ${ci}, this)"
                    oninput="handleLabelInput(${ci}, this)"
                    onfocus="isTypingLabel = true"
                    onblur="isTypingLabel = false"
                    placeholder="wat gaan we doen?">`;
                h += '</div></div></div>';
            });
            c.innerHTML = h;
        }

        const TOTAL_DAYS = 365;

        function getLabelString(ci) {
            let str = ' '.repeat(TOTAL_DAYS);
            const sortedDates = Object.keys(labels[ci] || {}).sort((a, b) => dateStrToIndex(a) - dateStrToIndex(b));
            sortedDates.forEach(ds => {
                const pos = dateStrToIndex(ds);
                const label = labels[ci][ds];
                str = str.slice(0, pos) + label + str.slice(pos + label.length);
            });
            return str;
        }

        function handleLabelKeydown(e, ci, input) {
            const pos = input.selectionStart;
            const val = input.value.padEnd(TOTAL_DAYS, ' ').slice(0, TOTAL_DAYS);

            if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                const newVal = val.slice(0, pos) + e.key + val.slice(pos + 1);
                input.value = newVal;
                input.setSelectionRange(pos + 1, pos + 1);
                parseAndSaveLabels(ci, newVal);
            }
            if (e.key === 'Backspace' && pos > 0) {
                e.preventDefault();
                const newVal = val.slice(0, pos - 1) + ' ' + val.slice(pos);
                input.value = newVal;
                input.setSelectionRange(pos - 1, pos - 1);
                parseAndSaveLabels(ci, newVal);
            }
            if (e.key === 'Delete' && pos < val.length) {
                e.preventDefault();
                const newVal = val.slice(0, pos) + ' ' + val.slice(pos + 1);
                input.value = newVal;
                input.setSelectionRange(pos, pos);
                parseAndSaveLabels(ci, newVal);
            }
        }

        function handleLabelInput(ci, input) {
            input.value = input.value.padEnd(TOTAL_DAYS, ' ').slice(0, TOTAL_DAYS);
            parseAndSaveLabels(ci, input.value);
        }

        function parseAndSaveLabels(ci, str) {
            labels[ci] = {};
            let i = 0;
            while (i < str.length) {
                if (str[i] !== ' ') {
                    let labelStart = i;
                    let label = '';
                    while (i < str.length && str[i] !== ' ') {
                        label += str[i];
                        i++;
                    }
                    const ds = indexToDateStr(labelStart);
                    labels[ci][ds] = label;
                } else {
                    i++;
                }
            }
            saveData();
        }

        // Mobile: single tap only - no drag
        function handleTouch(ci, t, ds, e) {
            e.preventDefault();
            if (ci !== currentCouple) { selectCouple(ci); return; }
            toggleSingleDay(ci, t, ds);
        }

        function startDrag(ci, t, ds, e) {
            e.preventDefault();
            if (ci !== currentCouple) { selectCouple(ci); return; }

            // On desktop, allow drag selection
            isDragging = true; dragStartDate = ds; dragEndDate = ds; dragType = t; dragCouple = ci;
            highlightDragSelection();
        }

        function toggleSingleDay(ci, t, ds) {
            const list = bookings[ci][t];
            const idx = list.indexOf(ds);
            if (idx > -1) {
                list.splice(idx, 1);
            } else {
                list.push(ds);
                if (t === 'locked') {
                    const tentList = bookings[ci].tentative;
                    const ti = tentList.indexOf(ds);
                    if (ti > -1) tentList.splice(ti, 1);
                }
            }
            saveData(); render();
            if (t === 'locked' && idx === -1) setTimeout(() => checkLevelUp(ds), 80);
        }

        function continueDrag(ds, e) {
            if (!isDragging) { showTooltip(e); return; }
            dragEndDate = ds; highlightDragSelection();
        }

        function highlightDragSelection() {
            clearDragHighlights();
            if (!dragStartDate || !dragEndDate) return;
            getDateRange(dragStartDate, dragEndDate).forEach(ds => {
                document.querySelectorAll(`[data-date="${ds}"][data-type="${dragType}"][data-couple="${dragCouple}"]`)
                    .forEach(c => c.classList.add('drag-selecting'));
            });
        }

        function clearDragHighlights() {
            document.querySelectorAll('.drag-selecting').forEach(e => e.classList.remove('drag-selecting'));
        }

        function finishDragSelection() {
            if (!dragStartDate || !dragEndDate || dragCouple === null) return;
            const dates = getDateRange(dragStartDate, dragEndDate);
            const list = bookings[dragCouple][dragType];
            const first = list.includes(dragStartDate);
            dates.forEach(ds => {
                const idx = list.indexOf(ds);
                if (first) { if (idx > -1) list.splice(idx, 1); }
                else { if (idx === -1) list.push(ds); }
            });
            if (dragType === 'locked' && !first) {
                const tentList = bookings[dragCouple].tentative;
                dates.forEach(ds => {
                    const ti = tentList.indexOf(ds);
                    if (ti > -1) tentList.splice(ti, 1);
                });
            }
            saveData(); render();
            if (dragType === 'locked' && !first) dates.forEach(ds => setTimeout(() => checkLevelUp(ds), 80));
        }

        function showTooltip(e) {
            const el = e.target; if (!el?.dataset?.display) return;
            document.getElementById('tooltipDate').textContent = el.dataset.display;
            let lbl = '';
            if (el.classList.contains('tentative')) lbl = 'We zien wel';
            else if (el.classList.contains('locked')) lbl = 'Gaan we doen';
            document.getElementById('tooltipLabel').textContent = lbl;
            document.getElementById('tooltipHoliday').textContent = el.dataset.holiday || '';
            document.getElementById('tooltipSchoolHoliday').textContent = el.dataset.schoolholiday || '';
            const tt = document.getElementById('tooltip');
            tt.style.display = 'block';
            tt.style.left = e.pageX + 'px';
            tt.style.top = (e.pageY - 45) + 'px';
        }

        function hideTooltip() { document.getElementById('tooltip').style.display = 'none'; }

        // Mobile Trip Modal Functions
        let pendingDeleteCouple = null;
        let pendingDeleteType = null;
        let pendingDeleteDate = null;

        function openTripModal() {
            const coupleSelect = document.getElementById('tripCouple');
            coupleSelect.innerHTML = couples.map((c, i) => `<option value="${i}">${c}</option>`).join('');
            coupleSelect.value = currentCouple;
            document.getElementById('tripType').value = 'tentative';
            document.getElementById('tripStartDate').value = '';
            document.getElementById('tripEndDate').value = '';
            document.getElementById('tripDescription').value = '';
            document.getElementById('tripModal').classList.add('active');
        }

        function closeTripModal() {
            document.getElementById('tripModal').classList.remove('active');
        }

        function saveTrip() {
            const coupleIdx = parseInt(document.getElementById('tripCouple').value);
            const type = document.getElementById('tripType').value;
            const startDate = document.getElementById('tripStartDate').value;
            const endDate = document.getElementById('tripEndDate').value;
            const description = document.getElementById('tripDescription').value.trim().toUpperCase();

            if (!startDate || !endDate) {
                alert('Selecteer start- en einddatum');
                return;
            }

            const start = new Date(startDate);
            const end = new Date(endDate);

            if (end < start) {
                alert('Einddatum moet na startdatum zijn');
                return;
            }

            // Add all dates in range
            const current = new Date(start);
            let isFirstDay = true;
            while (current <= end) {
                const m = current.getMonth();
                const d = current.getDate();
                const ds = `${m}-${d}`;

                if (!bookings[coupleIdx][type].includes(ds)) {
                    bookings[coupleIdx][type].push(ds);
                }

                // If locking, remove from tentative
                if (type === 'locked') {
                    const tentIdx = bookings[coupleIdx].tentative.indexOf(ds);
                    if (tentIdx > -1) bookings[coupleIdx].tentative.splice(tentIdx, 1);
                }

                // Add description label on first day
                if (isFirstDay && description) {
                    labels[coupleIdx][ds] = description;
                    isFirstDay = false;
                }

                current.setDate(current.getDate() + 1);
            }

            saveData();
            render();
            closeTripModal();

            // Check level up for locked dates
            if (type === 'locked') {
                const checkCurrent = new Date(start);
                while (checkCurrent <= end) {
                    const m = checkCurrent.getMonth();
                    const d = checkCurrent.getDate();
                    const ds = `${m}-${d}`;
                    setTimeout(() => checkLevelUp(ds), 80);
                    checkCurrent.setDate(checkCurrent.getDate() + 1);
                }
            }
        }

        function openDeleteModal(coupleIdx, type, dateStr, displayDate) {
            pendingDeleteCouple = coupleIdx;
            pendingDeleteType = type;
            pendingDeleteDate = dateStr;
            const typeName = type === 'tentative' ? 'We zien wel' : 'Gaan we doen';
            document.getElementById('deleteModalInfo').textContent = `${couples[coupleIdx]} - ${typeName} - ${displayDate}`;
            document.getElementById('deleteModal').classList.add('active');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
            pendingDeleteCouple = null;
            pendingDeleteType = null;
            pendingDeleteDate = null;
        }

        function confirmDeleteTrip() {
            if (pendingDeleteCouple !== null && pendingDeleteType && pendingDeleteDate) {
                const list = bookings[pendingDeleteCouple][pendingDeleteType];
                const idx = list.indexOf(pendingDeleteDate);
                if (idx > -1) {
                    list.splice(idx, 1);
                    saveData();
                    render();
                }
            }
            closeDeleteModal();
        }

        // Override handleTouch for mobile to show delete modal when tapping selected dates
        const originalHandleTouch = handleTouch;
        handleTouch = function(ci, t, ds, e) {
            e.preventDefault();

            // Check if this date is already booked
            const isBooked = bookings[ci]?.[t]?.includes(ds);

            if (isBooked) {
                // Show delete modal
                const [m, d] = ds.split('-').map(Number);
                const displayDate = `${d} ${MONTHS[m]} 2026`;
                openDeleteModal(ci, t, ds, displayDate);
            } else {
                // On mobile, don't allow adding by tap - use the + button instead
                // Just select the couple
                if (ci !== currentCouple) {
                    selectCouple(ci);
                }
            }
        };

        // ============ FUEL TRACKER ============
        let fuelEntries = [];
        let currentFuelType = 'drive';
        let isSavingFuel = false;

        async function loadFuelEntries() {
            try {
                const snapshot = await db.collection('wezienwel_fuel').orderBy('timestamp', 'desc').get();
                fuelEntries = [];
                snapshot.forEach(doc => {
                    fuelEntries.push({ id: doc.id, ...doc.data() });
                });
            } catch (e) {
                console.error('Error loading fuel entries:', e);
            }
        }

        async function saveFuelEntry() {
            const coupleIdx = parseInt(document.getElementById('fuelCouple').value);
            let entry = {
                coupleIdx,
                coupleName: couples[coupleIdx],
                type: currentFuelType,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                date: new Date().toISOString()
            };

            if (currentFuelType === 'drive') {
                const km = parseFloat(document.getElementById('fuelKm').value);
                if (!km || km <= 0) {
                    alert('Vul een geldige afstand in');
                    return;
                }
                entry.km = km;
                const note = document.getElementById('fuelNote').value.trim();
                if (note) entry.note = note;
            } else {
                const amount = parseFloat(document.getElementById('fuelAmount').value);
                if (!amount || amount <= 0) {
                    alert('Vul een geldig bedrag in');
                    return;
                }
                entry.amount = amount;
            }

            isSavingFuel = true;
            try {
                const docRef = await db.collection('wezienwel_fuel').add(entry);
                entry.id = docRef.id;
                fuelEntries.unshift(entry);
                renderFuelTracker();
                closeFuelModal();
            } catch (e) {
                console.error('Error saving fuel entry:', e);
                alert('Error: ' + e.message);
            }
            setTimeout(() => { isSavingFuel = false; }, 1000);
        }

        async function deleteFuelEntry(id) {
            if (!confirm('Verwijderen?')) return;
            try {
                await db.collection('wezienwel_fuel').doc(id).delete();
                fuelEntries = fuelEntries.filter(e => e.id !== id);
                renderFuelTracker();
            } catch (e) {
                console.error('Error deleting fuel entry:', e);
            }
        }

        function openFuelModal(type) {
            currentFuelType = type;
            const modal = document.getElementById('fuelModal');
            const title = document.getElementById('fuelModalTitle');
            const kmGroup = document.getElementById('fuelKmGroup');
            const noteGroup = document.getElementById('fuelNoteGroup');
            const amountGroup = document.getElementById('fuelAmountGroup');
            const coupleSelect = document.getElementById('fuelCouple');

            coupleSelect.innerHTML = couples.map((c, i) => `<option value="${i}">${c}</option>`).join('');
            coupleSelect.value = currentCouple;

            if (type === 'drive') {
                title.textContent = 'Kort Ritje toevoegen';
                kmGroup.style.display = 'block';
                noteGroup.style.display = 'block';
                amountGroup.style.display = 'none';
                document.getElementById('fuelKm').value = '';
                document.getElementById('fuelNote').value = '';
            } else {
                title.textContent = 'Tanken toevoegen';
                kmGroup.style.display = 'none';
                noteGroup.style.display = 'none';
                amountGroup.style.display = 'block';
                document.getElementById('fuelAmount').value = '';
            }

            modal.classList.add('active');
        }

        function closeFuelModal() {
            document.getElementById('fuelModal').classList.remove('active');
        }

        function calculateFuelBalances() {
            // Total km per couple
            const kmPerCouple = {};
            // Total paid per couple
            const paidPerCouple = {};

            couples.forEach((_, i) => {
                kmPerCouple[i] = 0;
                paidPerCouple[i] = 0;
            });

            let totalKm = 0;
            let totalPaid = 0;

            fuelEntries.forEach(entry => {
                if (entry.type === 'drive' && entry.km) {
                    kmPerCouple[entry.coupleIdx] = (kmPerCouple[entry.coupleIdx] || 0) + entry.km;
                    totalKm += entry.km;
                } else if (entry.type === 'refill' && entry.amount) {
                    paidPerCouple[entry.coupleIdx] = (paidPerCouple[entry.coupleIdx] || 0) + entry.amount;
                    totalPaid += entry.amount;
                }
            });

            // Calculate fair share per couple based on km driven
            const balances = {};
            couples.forEach((name, i) => {
                const kmDriven = kmPerCouple[i] || 0;
                const paid = paidPerCouple[i] || 0;
                const fairShare = totalKm > 0 ? (kmDriven / totalKm) * totalPaid : 0;
                const balance = paid - fairShare;

                balances[i] = {
                    name,
                    km: kmDriven,
                    paid,
                    fairShare,
                    balance
                };
            });

            return { balances, totalKm, totalPaid };
        }

        let fuelHistoryExpanded = false;

        function renderFuelTracker() {
            const { balances, totalKm, totalPaid } = calculateFuelBalances();

            // Render balance cards
            const balancesContainer = document.getElementById('fuelBalances');
            balancesContainer.innerHTML = couples.map((name, i) => {
                const b = balances[i];
                const balanceClass = b.balance >= 0 ? 'positive' : 'negative';
                const balanceSign = b.balance >= 0 ? '+' : '';
                return `
                    <div class="fuel-balance-card">
                        <div class="fuel-balance-name">${name}</div>
                        <div class="fuel-balance-amount ${balanceClass}">${balanceSign}€${b.balance.toFixed(2)}</div>
                        <div class="fuel-balance-details">
                            ${b.km.toFixed(0)} km gereden · €${b.paid.toFixed(2)} betaald
                        </div>
                    </div>
                `;
            }).join('');

            // Render history
            const historyContainer = document.getElementById('fuelHistory');
            const toggleBtn = document.getElementById('fuelHistoryToggle');

            if (fuelEntries.length === 0) {
                historyContainer.innerHTML = '<div style="font-size:0.7rem;color:rgba(0,0,0,0.4);padding:8px 0;">Nog geen ritten of tankbeurten</div>';
                toggleBtn.style.display = 'none';
            } else {
                const itemsToShow = fuelHistoryExpanded ? fuelEntries : fuelEntries.slice(0, 3);
                historyContainer.innerHTML = itemsToShow.map(entry => {
                    const date = entry.date ? new Date(entry.date).toLocaleDateString('nl-BE') : '';
                    if (entry.type === 'drive') {
                        const noteText = entry.note ? ` · ${entry.note}` : '';
                        return `
                            <div class="fuel-history-item">
                                <div class="fuel-history-info">
                                    <div class="fuel-history-type">🚗 ${entry.coupleName} - ${entry.km} km${noteText}</div>
                                    <div class="fuel-history-meta">${date}</div>
                                </div>
                                <button class="fuel-history-delete" onclick="deleteFuelEntry('${entry.id}')">×</button>
                            </div>
                        `;
                    } else {
                        return `
                            <div class="fuel-history-item">
                                <div class="fuel-history-info">
                                    <div class="fuel-history-type">⛽ ${entry.coupleName} - €${entry.amount.toFixed(2)}</div>
                                    <div class="fuel-history-meta">${date}</div>
                                </div>
                                <button class="fuel-history-delete" onclick="deleteFuelEntry('${entry.id}')">×</button>
                            </div>
                        `;
                    }
                }).join('');

                // Show toggle button only if more than 3 entries
                if (fuelEntries.length > 3) {
                    toggleBtn.style.display = 'inline-block';
                    toggleBtn.textContent = fuelHistoryExpanded ? 'Toon minder' : `Toon meer (${fuelEntries.length - 3})`;
                } else {
                    toggleBtn.style.display = 'none';
                }
            }
        }

        function toggleFuelHistory() {
            fuelHistoryExpanded = !fuelHistoryExpanded;
            renderFuelTracker();
        }

        // Add fuel listener setup to init
        const originalInit = init;
        init = async function() {
            await originalInit();
            await loadFuelEntries();
            renderFuelTracker();

            // Real-time listener for fuel entries
            db.collection('wezienwel_fuel').orderBy('timestamp', 'desc').onSnapshot((snapshot) => {
                if (isSavingFuel) return;
                fuelEntries = [];
                snapshot.forEach(doc => {
                    fuelEntries.push({ id: doc.id, ...doc.data() });
                });
                renderFuelTracker();
            });
        };

        // Close modal on outside click
        document.getElementById('fuelModal').addEventListener('click', (e) => {
            if (e.target.id === 'fuelModal') closeFuelModal();
        });

        init();
    </script>
</body>
